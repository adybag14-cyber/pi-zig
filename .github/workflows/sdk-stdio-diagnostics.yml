name: SDK stdio diagnostics
on:
  push:
    branches:
      - work/sdk-stdio-diagnostics-20261010
permissions:
  contents: read
concurrency:
  group: sdk-stdio-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tiny-language-pattern:
    if: github.ref == 'refs/heads/work/sdk-stdio-diagnostics-20261010'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact tiny diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install exact Zig release
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Prepare exact external reproducer and tool receipt
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          $taskDir = 'verification/sdk-stdio-pattern'

          $taskRepro = "$taskDir/repro"

          New-Item -ItemType Directory -Path $taskRepro -Force | Out-Null

          $taskSources = [ordered]@{
            'build.zig' = ''
            'helpers.zig' = 'cHViIHZhciBvYnNlcnZlZDogP2FueWVycm9yID0gbnVsbDsKcHViIGZuIGxvYWRTb3VyY2UoZmFpbGVkOiBib29sKSAhdm9pZCB7CiAgICBpZiAoZmFpbGVkKSByZXR1cm4gZXJyb3IuU291cmNlTG9hZEZhaWx1cmU7Cn0KcHViIGZuIHdyaXRlT3duZXJUZXJtaW5hdGlvbihmYWlsdXJlOiA/YW55ZXJyb3IpICF2b2lkIHsKICAgIG9ic2VydmVkID0gZmFpbHVyZTsKfQo='
            'original.zig' = ''
            'variants.zig' = ''
          }

          foreach ($entry in $taskSources.GetEnumerator()) {
          [IO.File]::WriteAllBytes((Join-Path $taskRepro $entry.Key),
          [Convert]::FromBase64String($entry.Value)) }

          $taskVersion = (& zig version).Trim()

          if ($taskVersion -cne '0.16.0') { throw 'Unexpected Zig compiler
          release' }

          git diff --exit-code 5aec3b2dcd03455ac5596bbc957ef6e93e75488d HEAD --
          build.zig src vendor tools

          if ($LASTEXITCODE -ne 0) { throw 'Tiny workflow follow-on changed the
          preserved implementation' }

          $taskFiles = @(Get-ChildItem -LiteralPath $taskRepro -Filter '*.zig'
          -File | ForEach-Object { [ordered]@{file=$_.Name;sha256=(Get-FileHash
          -Algorithm SHA256 -LiteralPath $_.FullName).Hash} })

          $taskZig = (Get-Command zig).Source

          [ordered]@{ head=(git rev-parse HEAD).Trim(); tree=(git rev-parse
          'HEAD^{tree}').Trim();
          preserved_467='a5432924d2b7855f0f56d51baf51046747c15d56';
          proposed_468='5aec3b2dcd03455ac5596bbc957ef6e93e75488d';
          zig_version=$taskVersion; zig_sha256=(Get-FileHash -Algorithm SHA256
          -LiteralPath $taskZig).Hash; sources=$taskFiles; scope='Tiny external
          language pattern only. No SDK compilation, runtime replay, EOF cause
          or parity qualification.' } | ConvertTo-Json -Depth 7 | Set-Content
          -LiteralPath "$taskDir/source-tool.json"
      - name: Original pattern - preserve expected compile failure
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 2
        run: >
          $ErrorActionPreference = 'Stop'

          $PSNativeCommandUseErrorActionPreference = $false

          $taskDir = (Resolve-Path 'verification/sdk-stdio-pattern').Path

          Push-Location "$taskDir/repro"

          try {
            & zig build original -j1 --test-timeout 30s --summary all 2>&1 | Tee-Object -FilePath "$taskDir/original.log"
            $taskExit = $LASTEXITCODE
            [ordered]@{target='original';exit_code=$taskExit;completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content -LiteralPath "$taskDir/original-result.json"
            if ($taskExit -ne 0) { exit $taskExit }
          } finally { Pop-Location }
      - name: Explicit-cast capture positive
        shell: pwsh
        timeout-minutes: 2
        run: >
          $ErrorActionPreference = 'Stop'

          $PSNativeCommandUseErrorActionPreference = $false

          $taskDir = (Resolve-Path 'verification/sdk-stdio-pattern').Path

          Push-Location "$taskDir/repro"

          try {
            & zig build cast -j1 --test-timeout 30s --summary all 2>&1 | Tee-Object -FilePath "$taskDir/cast.log"
            $taskExit = $LASTEXITCODE
            [ordered]@{target='cast';exit_code=$taskExit;completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content -LiteralPath "$taskDir/cast-result.json"
            if ($taskExit -ne 0) { exit $taskExit }
          } finally { Pop-Location }
      - name: Block capture bare return - preserve expected compile failure
        if: always()
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 2
        run: >
          $ErrorActionPreference = 'Stop'

          $PSNativeCommandUseErrorActionPreference = $false

          $taskDir = (Resolve-Path 'verification/sdk-stdio-pattern').Path

          Push-Location "$taskDir/repro"

          try {
            & zig build block -j1 --test-timeout 30s --summary all 2>&1 | Tee-Object -FilePath "$taskDir/block.log"
            $taskExit = $LASTEXITCODE
            [ordered]@{target='block';exit_code=$taskExit;completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content -LiteralPath "$taskDir/block-result.json"
            if ($taskExit -ne 0) { exit $taskExit }
          } finally { Pop-Location }
      - name: Distinguish reproduction from refutation
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskDir = 'verification/sdk-stdio-pattern'
          $original = Get-Content -Raw -LiteralPath "$taskDir/original-result.json" | ConvertFrom-Json
          $cast = Get-Content -Raw -LiteralPath "$taskDir/cast-result.json" | ConvertFrom-Json
          $block = Get-Content -Raw -LiteralPath "$taskDir/block-result.json" | ConvertFrom-Json
          $originalLog = Get-Content -Raw -LiteralPath "$taskDir/original.log"
          $castLog = Get-Content -Raw -LiteralPath "$taskDir/cast.log"
          $blockLog = Get-Content -Raw -LiteralPath "$taskDir/block.log"
          $reproduced = $original.exit_code -ne 0 -and $originalLog.Contains('expected error union type')
          $castPass = $cast.exit_code -eq 0 -and $castLog.Contains('1/1 tests passed')
          $blockReproduced = $block.exit_code -ne 0 -and $blockLog.Contains('expected error union type')
          [ordered]@{original_exit=$original.exit_code;expected_original_compile_failure_reproduced=$reproduced;cast_exit=$cast.exit_code;explicit_cast_capture_test_passed=$castPass;block_exit=$block.exit_code;block_bare_return_compile_failure_reproduced=$blockReproduced;scope='Compiler pattern only; original and block negatives retained explicitly; no SDK runtime conclusion'} | ConvertTo-Json | Set-Content -LiteralPath "$taskDir/pattern-result.json"
          if ($original.exit_code -eq 0) { throw 'REFUTED: minimal original compiled. Inspect the actual SDK catch/return context before attributing a fix.' }
          if (-not $reproduced) { throw 'Original failed for a different reason; expected diagnostic not reproduced' }
          if (-not $castPass) { throw 'Explicit union-cast capture is not proven' }
          if (-not $blockReproduced) { throw 'Previously observed block-form negative is not reproduced' }
      - name: Upload tiny pattern source, logs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-stdio-tiny-pattern-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          path: verification/sdk-stdio-pattern/**
          if-no-files-found: warn
