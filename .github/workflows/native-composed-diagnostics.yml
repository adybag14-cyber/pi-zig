name: Native composed SDK locale and lifecycle qualification

on:
  push:
    branches: [work/native-composed-20261011, work/native-windows-main-rs-20261011]

permissions:
  contents: read

concurrency:
  group: native-composed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.ref_name == 'work/native-windows-main-rs-20261011' && '{"include":[{"os":"windows-latest","mode":"ReleaseSafe","family":"processes"}]}' || '{"os":["windows-latest","ubuntu-latest","macos-latest"],"mode":["Debug","ReleaseSafe"],"family":["vm","processes"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.mode == 'ReleaseSafe' && matrix.family == 'processes' && 35 || 25 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Freeze source and tool identity
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path verification/native-composed -Force | Out-Null
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $env:EXPECTED_HEAD) { throw 'Checkout head mismatch' }
          if ((& zig version).Trim() -cne '0.16.0') { throw 'Unexpected Zig version' }
          $zig = (Get-Command zig).Source
          [ordered]@{ head = $head; tree = (git rev-parse 'HEAD^{tree}').Trim(); zig_sha256 = (Get-FileHash -LiteralPath $zig).Hash; mode = '${{ matrix.mode }}'; family = '${{ matrix.family }}'; scope = 'One composed VM artifact retains original SDK, locale, native allocation, lifecycle, retention, public image, command component and stdio assertions. Actual pipes and Main remain separate process tests. Native coverage gate requires every selected Source test name and complete execution. Interactive PTY, full SDK factory and owned AgentSession behavior, full Combined and full Pi parity remain separate requirements.' } | ConvertTo-Json | Set-Content verification/native-composed/source.json
          @(git ls-files | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_).Hash } }) | ConvertTo-Json | Set-Content verification/native-composed/inputs.json
      - name: Verify original modules and every tracked input
        shell: pwsh
        env:
          SOURCE_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = (Get-Location).ProviderPath
          $taskReceipt = Join-Path $taskRoot 'verification/sdk-original-cwd-544'
          New-Item -ItemType Directory -Path $taskReceipt -Force | Out-Null
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_EXPECTED_HEAD) { throw 'Source head drift' }
          $taskOracle = Join-Path $taskRoot 'verification/source-oracles/sdk-cwd-542'
          $taskManifestPath = Join-Path $taskOracle 'SOURCE-MANIFEST.json'
          if ((Get-FileHash -LiteralPath $taskManifestPath).Hash -cne '2A793675AD5BC9016B790B75D1ED0A5AF4BF8A1B5B7EA1733C15DF65436B31DF') { throw 'Original Source manifest drift' }
          $taskManifest = Get-Content -LiteralPath $taskManifestPath -Raw | ConvertFrom-Json
          if ($taskManifest.files.Count -ne 44) { throw 'Original Source dependency count drift' }
          foreach ($taskInput in $taskManifest.files) {
            if ((Get-FileHash -LiteralPath (Join-Path $taskOracle $taskInput.path)).Hash -cne $taskInput.sha256) { throw "Original module/dependency drift: $($taskInput.path)" }
          }
          $taskInputs = @(git ls-files | Sort-Object | ForEach-Object {
            [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath (Join-Path $taskRoot $_)).Hash }
          })
          $taskInputs | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskReceipt 'inputs-before.json') -Encoding utf8NoBOM
          [ordered]@{
            head = $env:SOURCE_EXPECTED_HEAD; tree = (git rev-parse 'HEAD^{tree}').Trim()
            manifest_sha256 = (Get-FileHash -LiteralPath $taskManifestPath).Hash
            tracked_inputs = $taskInputs.Count; original_files = 44; scope = 'SOURCE-ONLY original production resolvePath;no native backend import/VM/compiler qualification'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $taskReceipt 'source.json') -Encoding utf8NoBOM

      - name: Download and verify exact official Node24.14 archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = (Get-Location).ProviderPath
          $taskReceipt = Join-Path $taskRoot 'verification/sdk-original-cwd-544'
          $taskTool = Join-Path $env:RUNNER_TEMP 'sdk-source-node-24.14.0'
          if (Test-Path -LiteralPath $taskTool) { throw 'Refuse to overwrite existing tool directory' }
          New-Item -ItemType Directory -Path $taskTool | Out-Null
          $taskArch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($IsWindows -and $taskArch -eq 'X64') {
            $taskArchive = 'node-v24.14.0-win-x64.zip'
            $taskHash = '313FA40C0D7B18575821DE8CB17483031FE07D95DE5994F6F435F3B345F85C66'
            $taskBinary = 'node-v24.14.0-win-x64/node.exe'
          } elseif ($IsLinux -and $taskArch -eq 'X64') {
            $taskArchive = 'node-v24.14.0-linux-x64.tar.xz'
            $taskHash = '41CD79BB7877C81605A9E68EC4C91547774F46A40C67A17E34D7179EF11729DF'
            $taskBinary = 'node-v24.14.0-linux-x64/bin/node'
          } elseif ($IsMacOS -and $taskArch -eq 'Arm64') {
            $taskArchive = 'node-v24.14.0-darwin-arm64.tar.gz'
            $taskHash = 'A1A54F46A750D2523D628D924AAB61758A51C9DAD3E0238BEB14141BE9615DD3'
            $taskBinary = 'node-v24.14.0-darwin-arm64/bin/node'
          } elseif ($IsMacOS -and $taskArch -eq 'X64') {
            $taskArchive = 'node-v24.14.0-darwin-x64.tar.gz'
            $taskHash = 'F2879EB810E25993A0578E5D878930266FD2EAFCFFE9F2839B3D8DB354D4879E'
            $taskBinary = 'node-v24.14.0-darwin-x64/bin/node'
          } else { throw "Unsupported original Source tool platform: $taskArch" }
          $taskArchivePath = Join-Path $taskTool $taskArchive
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.14.0/$taskArchive" -OutFile $taskArchivePath -TimeoutSec 90
          if ((Get-FileHash -LiteralPath $taskArchivePath).Hash -cne $taskHash) { throw 'Official Node archive checksum mismatch' }
          if ($IsWindows) { Expand-Archive -LiteralPath $taskArchivePath -DestinationPath $taskTool }
          else { & tar -xf $taskArchivePath -C $taskTool; if ($LASTEXITCODE -ne 0) { throw 'Node extraction failed' } }
          $taskNode = Join-Path $taskTool $taskBinary
          $taskNodeHash = (Get-FileHash -LiteralPath $taskNode).Hash
          if ($IsWindows -and $taskNodeHash -cne '63C259C81E5D472B5F11C8D506070130CB04A1ECF84B80377A34ED6EC9048088') { throw 'Original qualified Windows Node executable mismatch' }
          [ordered]@{ version = '24.14.0'; archive = $taskArchive; archive_sha256 = $taskHash; node = $taskNode; node_sha256 = $taskNodeHash; architecture = $taskArch } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $taskReceipt 'tool.json') -Encoding utf8NoBOM

      - name: Execute only the owned bounded original Source oracle
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = (Get-Location).ProviderPath
          $taskReceipt = Join-Path $taskRoot 'verification/sdk-original-cwd-544'
          $taskTool = Get-Content -LiteralPath (Join-Path $taskReceipt 'tool.json') -Raw | ConvertFrom-Json
          if ($IsWindows) { $taskFree = [uint64](Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory * 1024 }
          elseif ($IsLinux) {
            $taskLine = Get-Content -LiteralPath '/proc/meminfo' | Where-Object { $_ -match '^MemAvailable:' }
            $taskFree = [uint64]([regex]::Match($taskLine, '\d+').Value) * 1024
            if ((Test-Path -LiteralPath '/sys/fs/cgroup/memory.max') -and (Test-Path -LiteralPath '/sys/fs/cgroup/memory.current')) {
              $taskLimit = (Get-Content -LiteralPath '/sys/fs/cgroup/memory.max' -Raw).Trim()
              if ($taskLimit -match '^\d+$') { $taskFree = [Math]::Min($taskFree,[Math]::Max(0,[int64]$taskLimit-[int64](Get-Content -LiteralPath '/sys/fs/cgroup/memory.current' -Raw))) }
            }
          } else {
            $taskPageSize = [uint64](& sysctl -n hw.pagesize)
            $taskStats = (& vm_stat) -join "`n"
            $taskPages = [uint64]0
            foreach ($taskKind in @('free','inactive','speculative')) { $taskPages += [uint64]([regex]::Match($taskStats,"Pages ${taskKind}:\s+(\d+)").Groups[1].Value) }
            $taskFree = $taskPages * $taskPageSize
          }
          [ordered]@{ free_bytes = $taskFree; minimum_bytes = 2147483648; heap_mib = 64; deadline_seconds = 30; checked_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $taskReceipt 'admission.json') -Encoding utf8NoBOM
          if ($taskFree -lt 2147483648) { throw 'Fresh Source-only 2GiB admission refused' }
          $taskStart = [Diagnostics.ProcessStartInfo]::new()
          $taskStart.FileName = $taskTool.node
          $taskStart.WorkingDirectory = $taskRoot
          $taskStart.UseShellExecute = $false
          $taskStart.CreateNoWindow = $true
          $taskStart.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
          $taskStart.RedirectStandardOutput = $true
          $taskStart.RedirectStandardError = $true
          $taskStart.ArgumentList.Add('--max-old-space-size=64')
          $taskStart.ArgumentList.Add((Join-Path $taskRoot 'verification/source-oracles/sdk-cwd-542/oracle.mjs'))
          $taskOutput = Join-Path $taskReceipt 'source-cwd-oracle.json'
          $taskStart.ArgumentList.Add($taskOutput)
          $taskProcess = [Diagnostics.Process]::new()
          $taskProcess.StartInfo = $taskStart
          if (!$taskProcess.Start()) { throw 'Original Source process failed to start' }
          $taskPid = $taskProcess.Id
          $taskCreated = $taskProcess.StartTime.ToUniversalTime()
          $taskStdout = $taskProcess.StandardOutput.ReadToEndAsync()
          $taskStderr = $taskProcess.StandardError.ReadToEndAsync()
          [ordered]@{ pid = $taskPid; created_utc = $taskCreated.ToString('o'); executable = $taskTool.node; executable_sha256 = $taskTool.node_sha256; argv = @($taskStart.ArgumentList); status = 'running' } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskReceipt 'owned-process.json') -Encoding utf8NoBOM
          if (!$taskProcess.WaitForExit(30000)) {
            $taskFresh = [Diagnostics.Process]::GetProcessById($taskPid)
            if ($taskFresh.StartTime.ToUniversalTime() -ne $taskCreated -or $taskFresh.MainModule.FileName -cne $taskTool.node) { throw 'Source deadline identity changed; refuse unrelated process control' }
            $taskProcess.Kill()
            $taskProcess.WaitForExit(5000) | Out-Null
            throw 'Original Source oracle timed out'
          }
          $taskStdout.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $taskReceipt 'stdout.log') -Encoding utf8NoBOM
          $taskStderr.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $taskReceipt 'stderr.log') -Encoding utf8NoBOM
          [ordered]@{ pid = $taskPid; created_utc = $taskCreated.ToString('o'); executable = $taskTool.node; executable_sha256 = $taskTool.node_sha256; argv = @($taskStart.ArgumentList); exit_code = $taskProcess.ExitCode; status = 'terminal'; completed_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskReceipt 'owned-process.json') -Encoding utf8NoBOM
          if ($taskProcess.ExitCode -ne 0) { throw 'Original Source oracle failed' }
          $taskProof = Get-Content -LiteralPath $taskOutput -Raw | ConvertFrom-Json
          if ($taskProof.schema -cne 'sdk-source-cwd-oracle-542-v1' -or $taskProof.node.version -cne '24.14.0' -or $taskProof.records.Count -ne 3 -or $taskProof.node.sha256 -cne $taskTool.node_sha256) { throw 'Original Source receipt authority mismatch' }
          $taskPlatform = if ($IsWindows) { 'win32' } elseif ($IsLinux) { 'linux' } else { 'darwin' }
          if ($taskProof.node.platform -cne $taskPlatform -or $taskProof.manifestSha256 -cne '2A793675AD5BC9016B790B75D1ED0A5AF4BF8A1B5B7EA1733C15DF65436B31DF') { throw 'Original Source platform or manifest mismatch' }
          $taskProof.records | ConvertTo-Json -Depth 5
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PI_SDK_SOURCE_CWD_ORACLE=$taskOutput" + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

      - name: Verify every original Source and tracked posthash
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = (Get-Location).ProviderPath
          $taskReceipt = Join-Path $taskRoot 'verification/sdk-original-cwd-544'
          if (Test-Path -LiteralPath (Join-Path $taskReceipt 'inputs-before.json')) {
            $taskInputs = Get-Content -LiteralPath (Join-Path $taskReceipt 'inputs-before.json') -Raw | ConvertFrom-Json
            $taskDrift = @($taskInputs | Where-Object { (Get-FileHash -LiteralPath (Join-Path $taskRoot $_.path)).Hash -cne $_.sha256 })
            [ordered]@{ head = (git rev-parse HEAD).Trim(); input_count = $taskInputs.Count; drift = $taskDrift } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $taskReceipt 'posthash.json') -Encoding utf8NoBOM
            if ($taskDrift.Count -ne 0) { throw 'Original Source or tracked input changed' }
          }

      - name: Verify original documentation modules and every tracked input
        shell: pwsh
        env:
          SOURCE_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = (Get-Location).ProviderPath
          $taskReceipt = Join-Path $taskRoot 'verification/sdk-original-doc-path-562'
          New-Item -ItemType Directory -Path $taskReceipt -Force | Out-Null
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_EXPECTED_HEAD) { throw 'Source head drift' }
          $taskOracle = Join-Path $taskRoot 'verification/source-oracles/sdk-docs-562'
          $taskManifestPath = Join-Path $taskOracle 'SOURCE-MANIFEST.json'
          if ((Get-FileHash -LiteralPath $taskManifestPath).Hash -cne 'C07E1824BFA0DE5935C19FCAD3056F08F2E06837C4CF08956DF17650282FEBA2') { throw 'Original Source manifest drift' }
          if ((Get-FileHash -LiteralPath (Join-Path $taskRoot 'verification/source-oracles/common/source-load-observer.mjs')).Hash -cne 'F818EA127D0453BB0AE3EE970D9FA0322EB2D7F6A7F17636C77F2F812AEDBCF8') { throw 'Qualified Source observer differs' }
          $taskManifest = Get-Content -LiteralPath $taskManifestPath -Raw | ConvertFrom-Json
          if ($taskManifest.files.Count -ne 49) { throw 'Original Source dependency count drift' }
          foreach ($taskInput in $taskManifest.files) {
            if ((Get-FileHash -LiteralPath (Join-Path $taskOracle $taskInput.path)).Hash -cne $taskInput.sha256) { throw "Original module/dependency drift: $($taskInput.path)" }
          }
          $taskInputs = @(git ls-files | Sort-Object | ForEach-Object {
            [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath (Join-Path $taskRoot $_)).Hash }
          })
          $taskInputs | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskReceipt 'inputs-before.json') -Encoding utf8NoBOM
          $taskObserverInputs = @($taskInputs | ForEach-Object { [ordered]@{ path = (Join-Path $taskRoot $_.path); sha256 = $_.sha256 } })
          $taskObserverInputs | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskReceipt 'observer-inputs.json') -Encoding utf8NoBOM
          [ordered]@{
            head = $env:SOURCE_EXPECTED_HEAD; tree = (git rev-parse 'HEAD^{tree}').Trim()
            manifest_sha256 = (Get-FileHash -LiteralPath $taskManifestPath).Hash
            tracked_inputs = $taskInputs.Count; original_files = 49; scope = 'SOURCE-ONLY original production config documentation path functions;no native backend import/VM/compiler qualification'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $taskReceipt 'source.json') -Encoding utf8NoBOM

      - name: Execute owned original documentation path Source oracle with verified Node
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = (Get-Location).ProviderPath
          $taskReceipt = Join-Path $taskRoot 'verification/sdk-original-doc-path-562'
          $taskTool = Get-Content -LiteralPath (Join-Path $taskRoot 'verification/sdk-original-cwd-544/tool.json') -Raw | ConvertFrom-Json
          if ($taskTool.version -cne '24.14.0' -or (Get-FileHash -LiteralPath $taskTool.node).Hash -cne $taskTool.node_sha256) { throw 'Previously verified Node tool identity drift' }
          Copy-Item -LiteralPath (Join-Path $taskRoot 'verification/sdk-original-cwd-544/tool.json') -Destination (Join-Path $taskReceipt 'tool.json')
          if ($IsWindows) { $taskFree = [uint64](Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory * 1024 }
          elseif ($IsLinux) {
            $taskLine = Get-Content -LiteralPath '/proc/meminfo' | Where-Object { $_ -match '^MemAvailable:' }
            $taskFree = [uint64]([regex]::Match($taskLine, '\d+').Value) * 1024
            if ((Test-Path -LiteralPath '/sys/fs/cgroup/memory.max') -and (Test-Path -LiteralPath '/sys/fs/cgroup/memory.current')) {
              $taskLimit = (Get-Content -LiteralPath '/sys/fs/cgroup/memory.max' -Raw).Trim()
              if ($taskLimit -match '^\d+$') { $taskFree = [Math]::Min($taskFree,[Math]::Max(0,[int64]$taskLimit-[int64](Get-Content -LiteralPath '/sys/fs/cgroup/memory.current' -Raw))) }
            }
          } else {
            $taskPageSize = [uint64](& sysctl -n hw.pagesize)
            $taskStats = (& vm_stat) -join "`n"
            $taskPages = [uint64]0
            foreach ($taskKind in @('free','inactive','speculative')) { $taskPages += [uint64]([regex]::Match($taskStats,"Pages ${taskKind}:\s+(\d+)").Groups[1].Value) }
            $taskFree = $taskPages * $taskPageSize
          }
          [ordered]@{ free_bytes = $taskFree; minimum_bytes = 2147483648; heap_mib = 64; deadline_seconds = 30; checked_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $taskReceipt 'admission.json') -Encoding utf8NoBOM
          if ($taskFree -lt 2147483648) { throw 'Fresh Source-only 2GiB admission refused' }
          $taskStart = [Diagnostics.ProcessStartInfo]::new()
          $taskStart.FileName = $taskTool.node
          $taskStart.WorkingDirectory = $taskRoot
          $taskStart.UseShellExecute = $false
          $taskStart.CreateNoWindow = $true
          $taskStart.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
          $taskStart.RedirectStandardOutput = $true
          $taskStart.RedirectStandardError = $true
          $taskStart.Environment['PI_PACKAGE_DIR'] = ''
          $taskStart.Environment['PI_SDK_SOURCE_551_MANIFEST'] = Join-Path $taskReceipt 'observer-inputs.json'
          $taskStart.Environment['PI_SDK_SOURCE_551_CLOSURE'] = Join-Path $taskReceipt 'executed-module-closure.json'
          $taskStart.ArgumentList.Add('--max-old-space-size=64')
          $taskStart.ArgumentList.Add('--import')
          $taskObserver = Join-Path $taskRoot 'verification/source-oracles/common/source-load-observer.mjs'
          $taskObserverUri = [UriBuilder]::new('file','',-1,$taskObserver.Replace('\','/')).Uri.AbsoluteUri
          $taskStart.ArgumentList.Add($taskObserverUri)
          $taskStart.ArgumentList.Add((Join-Path $taskRoot 'verification/source-oracles/sdk-docs-562/oracle.mjs'))
          $taskOutput = Join-Path $taskReceipt 'source-doc-path-oracle.json'
          $taskStart.ArgumentList.Add($taskOutput)
          $taskProcess = [Diagnostics.Process]::new()
          $taskProcess.StartInfo = $taskStart
          if (!$taskProcess.Start()) { throw 'Original Source process failed to start' }
          $taskPid = $taskProcess.Id
          $taskCreated = $taskProcess.StartTime.ToUniversalTime()
          $taskStdout = $taskProcess.StandardOutput.ReadToEndAsync()
          $taskStderr = $taskProcess.StandardError.ReadToEndAsync()
          [ordered]@{ pid = $taskPid; created_utc = $taskCreated.ToString('o'); executable = $taskTool.node; executable_sha256 = $taskTool.node_sha256; argv = @($taskStart.ArgumentList); status = 'running' } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskReceipt 'owned-process.json') -Encoding utf8NoBOM
          if (!$taskProcess.WaitForExit(30000)) {
            $taskFresh = [Diagnostics.Process]::GetProcessById($taskPid)
            if ($taskFresh.StartTime.ToUniversalTime() -ne $taskCreated -or $taskFresh.MainModule.FileName -cne $taskTool.node) { throw 'Source deadline identity changed; refuse unrelated process control' }
            $taskProcess.Kill()
            $taskProcess.WaitForExit(5000) | Out-Null
            throw 'Original Source oracle timed out'
          }
          $taskStdout.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $taskReceipt 'stdout.log') -Encoding utf8NoBOM
          $taskStderr.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $taskReceipt 'stderr.log') -Encoding utf8NoBOM
          [ordered]@{ pid = $taskPid; created_utc = $taskCreated.ToString('o'); executable = $taskTool.node; executable_sha256 = $taskTool.node_sha256; argv = @($taskStart.ArgumentList); exit_code = $taskProcess.ExitCode; status = 'terminal'; completed_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskReceipt 'owned-process.json') -Encoding utf8NoBOM
          if ($taskProcess.ExitCode -ne 0) { throw 'Original Source oracle failed' }
          $taskProof = Get-Content -LiteralPath $taskOutput -Raw | ConvertFrom-Json
          if ($taskProof.schema -cne 'sdk-source-doc-path-oracle-562-v1' -or $taskProof.node.version -cne '24.14.0' -or $taskProof.records.Count -ne 3 -or $taskProof.node.sha256 -cne $taskTool.node_sha256) { throw 'Original Source receipt authority mismatch' }
          $taskPlatform = if ($IsWindows) { 'win32' } elseif ($IsLinux) { 'linux' } else { 'darwin' }
          if ($taskProof.node.platform -cne $taskPlatform -or $taskProof.manifestSha256 -cne 'C07E1824BFA0DE5935C19FCAD3056F08F2E06837C4CF08956DF17650282FEBA2') { throw 'Original Source platform or manifest mismatch' }
          $taskClosure = Get-Content -LiteralPath (Join-Path $taskReceipt 'executed-module-closure.json') -Raw | ConvertFrom-Json
          if ($taskClosure.exit_code -ne 0 -or $taskClosure.loaded_count -lt 4 -or $taskClosure.post_drift.Count -ne 0 -or @($taskClosure.records | Where-Object { $_.actual_loader_source_sha256 -cne $_.file_sha256 }).Count -ne 0) { throw 'Actual default-loader module closure drift or transformation' }
          if ($taskClosure.manifest_sha256 -cne (Get-FileHash -LiteralPath (Join-Path $taskReceipt 'observer-inputs.json')).Hash) { throw 'Actual closure manifest differs' }
          $taskProof.records | ConvertTo-Json -Depth 5
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PI_SDK_SOURCE_DOCS_ORACLE=$taskOutput" + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

      - name: Verify original documentation Source and tracked posthash
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = (Get-Location).ProviderPath
          $taskReceipt = Join-Path $taskRoot 'verification/sdk-original-doc-path-562'
          if (Test-Path -LiteralPath (Join-Path $taskReceipt 'inputs-before.json')) {
            $taskInputs = Get-Content -LiteralPath (Join-Path $taskReceipt 'inputs-before.json') -Raw | ConvertFrom-Json
            $taskDrift = @($taskInputs | Where-Object { (Get-FileHash -LiteralPath (Join-Path $taskRoot $_.path)).Hash -cne $_.sha256 })
            [ordered]@{ head = (git rev-parse HEAD).Trim(); input_count = $taskInputs.Count; drift = $taskDrift } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $taskReceipt 'posthash.json') -Encoding utf8NoBOM
            if ($taskDrift.Count -ne 0) { throw 'Original Source or tracked input changed' }
          }

      - name: Exercise composed SDK locale allocation and lifetime suites
        if: matrix.family == 'vm'
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & zig fmt --check build.zig src tools
          if ($LASTEXITCODE -ne 0) { throw 'Native source formatting failed' }
          & zig build test-native-composed-vm -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object verification/native-composed/tests.log
          $result = $LASTEXITCODE
          [ordered]@{ exit_code = $result; completed_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content verification/native-composed/result.json
          if ($result -ne 0) { exit $result }
          & zig build test-native-composed-coverage maintenance -j1 --summary all -- verify-composed-coverage . verification/native-composed/tests.log 2>&1 | Tee-Object verification/native-composed/coverage.log
          if ($LASTEXITCODE -ne 0) { throw 'Missing or incomplete named native coverage' }
      - name: Exercise actual Main and native process streams
        if: matrix.family == 'processes'
        shell: pwsh
        # Main's cold compiler graph has its own job; every original process
        # test and the 120-second test guard remain required.
        # The observed Windows ReleaseSafe cold Main compile exceeded 22m
        # after 12m of dependency work; allow 32m for this compiler workload.
        timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.mode == 'ReleaseSafe' && 32 || 22 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & zig fmt --check build.zig src tools
          if ($LASTEXITCODE -ne 0) { throw 'Native source formatting failed' }
          & zig build test-native-physical-stdio-process test-main-native-context-process -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all --verbose 2>&1 | Tee-Object verification/native-composed/tests.log
          $result = $LASTEXITCODE
          [ordered]@{ exit_code = $result; completed_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content verification/native-composed/result.json
          if ($result -ne 0) { exit $result }
      - name: Verify inputs and preserve executable hashes
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputs = @(Get-Content -Raw verification/native-composed/inputs.json | ConvertFrom-Json)
          $drift = @($inputs | Where-Object { (Get-FileHash -LiteralPath $_.path).Hash -cne $_.sha256 })
          [ordered]@{ inputs = $inputs.Count; mismatches = $drift.Count } | ConvertTo-Json | Set-Content verification/native-composed/posthash.json
          if (Test-Path zig-out/bin) {
            @(Get-ChildItem zig-out/bin -File | ForEach-Object { [ordered]@{ name = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName).Hash } }) | ConvertTo-Json | Set-Content verification/native-composed/executables.json
          }
          if ($drift.Count -ne 0) { throw 'Tracked source changed during execution' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked tree changed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-composed-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.family }}-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          path: |
            verification/native-composed/**
            verification/sdk-original-cwd-544/**
            verification/source-oracles/sdk-cwd-542/**
            verification/sdk-original-doc-path-562/**
            verification/source-oracles/sdk-docs-562/**
            verification/source-oracles/common/source-load-observer.mjs
