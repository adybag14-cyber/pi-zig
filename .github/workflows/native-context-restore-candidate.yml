name: Native context and transcript restoration qualification

on:
  push:
    branches: [work/native-context-restore-1692-20261014]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-context-restore-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, ReleaseSafe]
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Freeze exact source and compiler
        id: freeze
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-context-restore-candidate'
          New-Item -ItemType Directory -Path $taskReceipt -Force | Out-Null
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_HEAD) { throw 'Checkout head mismatch' }
          if ((& zig version).Trim() -cne '0.16.0') { throw 'Unexpected Zig version' }
          $taskZigInfo = [IO.FileInfo]::new((Get-Command zig | Select-Object -First 1).Source)
          $taskZigTarget = $taskZigInfo.ResolveLinkTarget($true)
          $taskZig = if ($taskZigTarget) { $taskZigTarget.FullName } else { $taskZigInfo.FullName }
          $taskToolRoot = Split-Path -Parent $taskZig
          $taskZigEnv = (& zig env) -join "`n"
          $taskLibMatch = [regex]::Match($taskZigEnv, '\.lib_dir = ("(?:[^"\\]|\\.)*")')
          if (!$taskLibMatch.Success) { throw 'Cannot identify the Zig library directory' }
          $taskLib = $taskLibMatch.Groups[1].Value | ConvertFrom-Json
          $taskInputs = @(git ls-files | Sort-Object | ForEach-Object { [ordered]@{path=$_; sha256=(Get-FileHash -LiteralPath $_).Hash} })
          $taskTools = @(Get-ChildItem -LiteralPath $taskToolRoot -File -Recurse | Sort-Object FullName | ForEach-Object { [ordered]@{path=$_.FullName; sha256=(Get-FileHash -LiteralPath $_.FullName).Hash} })
          $taskInputs | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/inputs.json"
          $taskTools | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/tools.json"
          [ordered]@{head=$env:EXPECTED_HEAD; tree=(git rev-parse 'HEAD^{tree}').Trim(); mode='${{ matrix.mode }}'; source_count=$taskInputs.Count; tool_count=@($taskTools).Count; public_activation=$false; scope='Original context20 and transcript restore22 with live receiver identity and native ownership; constructor initialization regression; complete factory remains unfinished'} | ConvertTo-Json | Set-Content "$taskReceipt/source.json"
      - name: Compile original context and transcript restoration artifacts
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-native-ai-transcript-context build-native-sdk-session-restore build-native-sdk-constructor-phase -Doptimize=${{ matrix.mode }} -Duse-llvm=true -j1 --summary all 2>&1 | Tee-Object verification/native-context-restore-candidate/compile.log
          if ($LASTEXITCODE -ne 0) { throw 'Context and restoration cold compilation failed' }
      - name: Exercise original context and transcript restoration with complete owner graphs
        id: runtime
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-context-restore-candidate'
          & zig build test-native-ai-transcript-context test-native-sdk-session-restore test-native-sdk-constructor-phase -Doptimize=${{ matrix.mode }} -Duse-llvm=true -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/runtime.log"
          if ($LASTEXITCODE -ne 0) { throw 'Context or restoration runtime failed' }
          $taskLog = Get-Content "$taskReceipt/runtime.log" -Raw
          if ($taskLog -notmatch '(?m)Build Summary:.*\b18/18 tests passed') { throw 'All18 context restoration and constructor phase tests must execute' }
          foreach ($taskCase in @(@{target='test-native-ai-transcript-context';count=4},@{target='test-native-sdk-session-restore';count=4},@{target='test-native-sdk-constructor-phase';count=10})) {
            $taskPattern = '(?ms)^'+[regex]::Escape($taskCase.target)+' success\r?\n[^\r\n]*run test '+$taskCase.count+' pass \('+$taskCase.count+' total\)'
            if ([regex]::Matches($taskLog,$taskPattern).Count -ne 1) { throw "Artifact execution changed: $($taskCase.target)" }
          }
          foreach ($taskCorpus in @(@{name='ai-transcript-context-1692';cases=20},@{name='sdk-session-restore-1692';cases=22})) {
            $taskName = $taskCorpus.name
            $taskFixture = Get-Content "src/extensions/fixtures/$taskName.json" -Raw | ConvertFrom-Json
            if ($taskFixture.sourceHead -cne '1692bba6347a287ab0f3cb554a4430fafffc474b') { throw 'Latest original upstream contract required' }
            if (@($taskFixture.rows).Count -ne $taskCorpus.cases -or $taskFixture.cases -ne $taskCorpus.cases) { throw 'Each original helper corpus must remain complete' }
            if ((Get-FileHash -LiteralPath "src/extensions/fixtures/$taskName.input.txt").Hash.ToLowerInvariant() -cne $taskFixture.inputSha256) { throw 'Original helper input hash differs' }
          }
          [ordered]@{head='${{ github.sha }}';status='passed';mode='${{ matrix.mode }}';platform='${{ matrix.os }}';tests=18;source_cases=42;context_cases=20;restore_cases=22;constructor_phase_tests=10;original_factory_instances=0;test_timeout_seconds=120;host_await_timeout_ms=10000;public_activation=$false;full_factory_qualified=$false;completed_utc=[DateTimeOffset]::UtcNow.ToString('o')}|ConvertTo-Json|Set-Content "$taskReceipt/result.json"
      - name: Verify frozen inputs after terminal execution
        if: ${{ always() && steps.freeze.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-context-restore-candidate'
          foreach ($taskKind in @('inputs','tools')) {
            $taskRows = @(Get-Content "$taskReceipt/$taskKind.json" -Raw | ConvertFrom-Json)
            $taskDrift = @($taskRows | Where-Object { !(Test-Path -LiteralPath $_.path) -or (Get-FileHash -LiteralPath $_.path).Hash -cne $_.sha256 } | ForEach-Object path)
            [ordered]@{count=$taskRows.Count; drift=$taskDrift; completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/$taskKind-posthash.json"
            if ($taskDrift.Count) { throw "Candidate frozen $taskKind changed" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-context-restore-candidate-${{ matrix.os }}-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 14
          path: verification/native-context-restore-candidate/
