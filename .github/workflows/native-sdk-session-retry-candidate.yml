name: Native session retry and classifier candidate

on:
  push:
    branches: [work/native-sdk-session-retry-1692-20261014]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sdk-session-retry-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, ReleaseSafe]
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Freeze exact source and compiler
        id: freeze
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-sdk-session-retry-candidate'
          New-Item -ItemType Directory -Path $taskReceipt -Force | Out-Null
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_HEAD) { throw 'Checkout head mismatch' }
          if ((& zig version).Trim() -cne '0.16.0') { throw 'Unexpected Zig version' }
          $taskZigInfo = [IO.FileInfo]::new((Get-Command zig | Select-Object -First 1).Source)
          $taskZigTarget = $taskZigInfo.ResolveLinkTarget($true)
          $taskZig = if ($taskZigTarget) { $taskZigTarget.FullName } else { $taskZigInfo.FullName }
          $taskToolRoot = Split-Path -Parent $taskZig
          $taskZigEnv = (& zig env) -join "`n"
          $taskLibMatch = [regex]::Match($taskZigEnv, '\.lib_dir = ("(?:[^"\\]|\\.)*")')
          if (!$taskLibMatch.Success) { throw 'Cannot identify the Zig library directory' }
          $taskLib = $taskLibMatch.Groups[1].Value | ConvertFrom-Json
          $taskInputs = @(git ls-files | Sort-Object | ForEach-Object { [ordered]@{path=$_; sha256=(Get-FileHash -LiteralPath $_).Hash} })
          $taskTools = @(Get-ChildItem -LiteralPath $taskToolRoot -File -Recurse | Sort-Object FullName | ForEach-Object { [ordered]@{path=$_.FullName; sha256=(Get-FileHash -LiteralPath $_.FullName).Hash} })
          $taskInputs | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/inputs.json"
          $taskTools | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/tools.json"
          [ordered]@{head=$env:EXPECTED_HEAD; tree=(git rev-parse 'HEAD^{tree}').Trim(); mode='${{ matrix.mode }}'; source_count=$taskInputs.Count; tool_count=@($taskTools).Count; public_activation=$false; scope='Original retry corpus and native recovery implementation; complete factory integration remains unfinished'} | ConvertTo-Json | Set-Content "$taskReceipt/source.json"
      - name: Compile session retry and classification artifact
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-native-sdk-session-retry -Doptimize=${{ matrix.mode }} -Duse-llvm=true -j1 --summary all 2>&1 | Tee-Object verification/native-sdk-session-retry-candidate/compile.log
          if ($LASTEXITCODE -ne 0) { throw 'Session retry cold compilation failed' }
          & zig build build-native-binary-operators -Doptimize=${{ matrix.mode }} -Duse-llvm=true -j1 --summary all 2>&1 | Tee-Object verification/native-sdk-session-retry-candidate/compile-arithmetic.log
          if ($LASTEXITCODE -ne 0) { throw 'VM arithmetic ABI cold compilation failed' }
      - name: Exercise original retry omission abort sleep callback and classifier owner graphs
        id: runtime
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-sdk-session-retry-candidate'
          & zig build test-native-sdk-session-retry -Doptimize=${{ matrix.mode }} -Duse-llvm=true -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/runtime.log"
          if ($LASTEXITCODE -ne 0) { throw 'Session retry runtime failed' }
          $taskLog = Get-Content "$taskReceipt/runtime.log" -Raw
          if ($taskLog -notmatch '(?m)Build Summary:.*\b13/13 tests passed') { throw 'All13 session retry tests must execute' }
          $taskPattern = '(?ms)^test-native-sdk-session-retry success\r?\n[^\r\n]*run test 13 pass \(13 total\)'
          if ([regex]::Matches($taskLog,$taskPattern).Count -ne 1) { throw 'Session retry artifact execution changed' }
          $taskFixture = Get-Content src/extensions/fixtures/sdk-session-retry-1692.json -Raw | ConvertFrom-Json
          if ($taskFixture.sourceHead -cne '1692bba6347a287ab0f3cb554a4430fafffc474b' -or $taskFixture.factoryCount -ne 31 -or @($taskFixture.rows).Count -ne 31) { throw 'Complete latest original31 reference required' }
          if ((Get-FileHash -LiteralPath src/extensions/fixtures/sdk-session-retry-1692.input.txt).Hash.ToLowerInvariant() -cne $taskFixture.inputSha256) { throw 'Original retry input hash differs' }
          $taskClassifier = Get-Content src/extensions/fixtures/sdk-session-retry-classifier-1692.json -Raw | ConvertFrom-Json
          if ($taskClassifier.sourceHead -cne '1692bba6347a287ab0f3cb554a4430fafffc474b' -or $taskClassifier.factoryCount -ne 30 -or @($taskClassifier.rows).Count -ne 30) { throw 'Complete latest original30 classifier reference required' }
          if ((Get-FileHash -LiteralPath src/extensions/fixtures/sdk-session-retry-classifier-1692.input.txt).Hash.ToLowerInvariant() -cne $taskClassifier.inputSha256) { throw 'Original classifier input hash differs' }
          [ordered]@{head='${{ github.sha }}';status='passed';mode='${{ matrix.mode }}';platform='${{ matrix.os }}';tests=13;corpus_cases=31;original_reference_comparison=$true;classifier_corpus_cases=30;classifier_original_reference_comparison=$true;test_timeout_seconds=120;host_await_timeout_ms=10000;public_activation=$false;full_factory_qualified=$false;completed_utc=[DateTimeOffset]::UtcNow.ToString('o')}|ConvertTo-Json|Set-Content "$taskReceipt/result.json"
      - name: Exercise original VM arithmetic remainder exponentiation and decrement boundary
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-sdk-session-retry-candidate'
          & zig build test-native-binary-operators -Doptimize=${{ matrix.mode }} -Duse-llvm=true -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/runtime-arithmetic.log"
          if ($LASTEXITCODE -ne 0) { throw 'VM arithmetic ABI regression failed' }
          $taskLog = Get-Content "$taskReceipt/runtime-arithmetic.log" -Raw
          $taskRuns = [regex]::Matches($taskLog, '(?ms)^test-native-binary-operators success\r?\n[^\r\n]*run test (?<count>[1-9]\d*) pass \(\k<count> total\)')
          if ($taskRuns.Count -ne 1) { throw 'Complete named VM arithmetic target and transitive tests must execute without skips' }
          $taskTests = [int]$taskRuns[0].Groups['count'].Value
          if ($taskLog -notmatch ("(?m)^Build Summary:.*\b"+$taskTests+'/'+$taskTests+' tests passed')) { throw 'VM arithmetic summary and executed inventory differ' }
          [ordered]@{head='${{ github.sha }}';status='passed';mode='${{ matrix.mode }}';platform='${{ matrix.os }}';tests=$taskTests;binary_operations=10;increment=$true;decrement=$true;original_guest_operator_comparison=$true;test_timeout_seconds=120;public_activation=$false;completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content "$taskReceipt/arithmetic-result.json"
      - name: Verify frozen inputs after terminal execution
        if: ${{ always() && steps.freeze.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-sdk-session-retry-candidate'
          foreach ($taskKind in @('inputs','tools')) {
            $taskRows = @(Get-Content "$taskReceipt/$taskKind.json" -Raw | ConvertFrom-Json)
            $taskDrift = @($taskRows | Where-Object { !(Test-Path -LiteralPath $_.path) -or (Get-FileHash -LiteralPath $_.path).Hash -cne $_.sha256 } | ForEach-Object path)
            [ordered]@{count=$taskRows.Count; drift=$taskDrift; completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/$taskKind-posthash.json"
            if ($taskDrift.Count) { throw "Candidate frozen $taskKind changed" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-sdk-session-retry-candidate-${{ matrix.os }}-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 14
          path: verification/native-sdk-session-retry-candidate/
