name: Native follow-up diagnostics

on:
  push:
    branches: [work/pi-native-followups-20261010]

permissions:
  contents: read

concurrency:
  group: native-followups-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regressions:
    name: Upstream regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Record exact source and toolchain
        shell: bash
        run: |
          mkdir -p verification/followup-diagnostics
          git rev-parse HEAD > verification/followup-diagnostics/source.txt
          git rev-parse 'HEAD^{tree}' >> verification/followup-diagnostics/source.txt
          zig version >> verification/followup-diagnostics/source.txt
      - name: Check formatting
        run: zig fmt --check build.zig src tools
      - name: Verify allocation coverage checker rejects incomplete evidence
        run: zig test tools/verify_codemode_coverage.zig
      - name: Exercise codemode allocation, engine lifecycle, WeakRefs and issuer exchange
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export PI_CODEMODE_ALLOCATION_SHARD=0 PI_CODEMODE_ALLOCATION_SHARDS=8
            export PI_SDK_ALLOCATION_SHARD=0 PI_SDK_ALLOCATION_SHARDS=8
          fi
          zig build test-codemode-source test-codemode test-extension-engine test-native-weakref test-mcp-issuer-exchange -Doptimize=Debug -j1 --test-timeout 180s --summary all 2>&1 | tee verification/followup-diagnostics/shard-0.log
      - name: Preserve diagnostic source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followup-${{ runner.os }}-${{ github.sha }}
          retention-days: 14
          path: verification/followup-diagnostics/**

  allocation:
    name: Complete macOS allocation range (${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Record exact source identity
        shell: bash
        run: |
          mkdir -p verification/allocation-ranges
          git rev-parse HEAD > verification/allocation-ranges/source-${{ matrix.shard }}.txt
          git rev-parse 'HEAD^{tree}' >> verification/allocation-ranges/source-${{ matrix.shard }}.txt
          zig version >> verification/allocation-ranges/source-${{ matrix.shard }}.txt
      - name: Complete all five named sweeps for this range
        timeout-minutes: 18
        shell: bash
        env:
          PI_CODEMODE_ALLOCATION_SHARD: ${{ matrix.shard }}
          PI_CODEMODE_ALLOCATION_SHARDS: "8"
          PI_SDK_ALLOCATION_SHARD: ${{ matrix.shard }}
          PI_SDK_ALLOCATION_SHARDS: "8"
        run: |
          set -euo pipefail
          zig build test-codemode-allocation test-codemode-model-allocation-shard -Doptimize=Debug -j1 --test-timeout 180s --summary all 2>&1 | tee verification/allocation-ranges/shard-${{ matrix.shard }}.log
      - name: Preserve range evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allocation-${{ github.sha }}-${{ matrix.shard }}
          retention-days: 14
          path: verification/allocation-ranges/**

  allocation-coverage:
    name: Verify complete allocation coverage
    needs: allocation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: allocation-${{ github.sha }}-*
          path: verification/allocation-ranges
          merge-multiple: true
      - name: Require matching source identities and exhaustive bounds
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > verification/allocation-ranges/expected-source.txt
          git rev-parse 'HEAD^{tree}' >> verification/allocation-ranges/expected-source.txt
          zig version >> verification/allocation-ranges/expected-source.txt
          for shard in 0 1 2 3 4 5 6 7; do
            cmp verification/allocation-ranges/expected-source.txt verification/allocation-ranges/source-$shard.txt
          done
          zig run tools/verify_codemode_coverage.zig -- 8 verification/allocation-ranges/shard-{0..7}.log > verification/allocation-ranges/coverage.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-allocation-coverage-${{ github.sha }}
          retention-days: 14
          path: verification/allocation-ranges/**
