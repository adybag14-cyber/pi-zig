name: Private ArrayBufferView intrinsic4 and genuine Node24 Source packets
on:
  push:
    branches: [work/env-node-arraybufferview-e6220e1-20261014]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-native-env-arraybufferview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-native:
    needs: source-only
    if: github.ref_name == 'work/env-node-arraybufferview-e6220e1-20261014'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Compile private intrinsic4 without runtime execution
        timeout-minutes: 23
        shell: pwsh
        run: |
          & ./tools/Invoke-EnvArrayBufferViewQualification.ps1 -Phase Compile -Mode '${{ matrix.mode }}' -ExpectedHead '${{ github.sha }}' -ExpectedManifestHash '490ADD7964BC2F7F1150E69EC2D14AA12180897797E5E975D06E1CA2A27AFE06' -AdmissionGiB 8 -HostedSoleJob -OuterSeconds 1320 -Receipt verification/env-arraybufferview/compile
          if($LASTEXITCODE -ne 0){throw 'Intrinsic4 compile failed'}
      - name: Run all15 Source fields real GC and complete host allocation failure sweep
        timeout-minutes: 7
        shell: pwsh
        run: |
          & ./tools/Invoke-EnvArrayBufferViewQualification.ps1 -Phase Run -Mode '${{ matrix.mode }}' -ExpectedHead '${{ github.sha }}' -ExpectedManifestHash '490ADD7964BC2F7F1150E69EC2D14AA12180897797E5E975D06E1CA2A27AFE06' -AdmissionGiB 8 -HostedSoleJob -OuterSeconds 300 -Receipt verification/env-arraybufferview/run
          if($LASTEXITCODE -ne 0){throw 'Intrinsic4 runtime failed'}
      - name: Retain exact source tools inventory and terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-env-arraybufferview-windows-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          path: verification/env-arraybufferview/**
  source-only:
    if: github.ref_name == 'work/env-node-arraybufferview-e6220e1-20261014'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: earendil-works/pi
          ref: e6220e1316f86af818a0ccbfe1c09d7e918b41cf
          path: verification/env-node-fs-reference
          persist-credentials: false
      - name: Download checksum-pinned reference Node24.14.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $arch=[Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if($IsWindows -and $arch -eq 'X64'){$archive='node-v24.14.0-win-x64.zip';$hash='313FA40C0D7B18575821DE8CB17483031FE07D95DE5994F6F435F3B345F85C66';$binary='node-v24.14.0-win-x64/node.exe'}
          elseif($IsLinux -and $arch -eq 'X64'){$archive='node-v24.14.0-linux-x64.tar.xz';$hash='41CD79BB7877C81605A9E68EC4C91547774F46A40C67A17E34D7179EF11729DF';$binary='node-v24.14.0-linux-x64/bin/node'}
          elseif($IsMacOS -and $arch -eq 'Arm64'){$archive='node-v24.14.0-darwin-arm64.tar.gz';$hash='A1A54F46A750D2523D628D924AAB61758A51C9DAD3E0238BEB14141BE9615DD3';$binary='node-v24.14.0-darwin-arm64/bin/node'}
          elseif($IsMacOS -and $arch -eq 'X64'){$archive='node-v24.14.0-darwin-x64.tar.gz';$hash='F2879EB810E25993A0578E5D878930266FD2EAFCFFE9F2839B3D8DB354D4879E';$binary='node-v24.14.0-darwin-x64/bin/node'}
          else{throw 'Unsupported Source-only tool platform'}
          $tool=Join-Path $env:RUNNER_TEMP env-node-fs-node24
          New-Item -ItemType Directory -Path $tool|Out-Null
          $file=Join-Path $tool $archive
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.14.0/$archive" -OutFile $file -TimeoutSec 90
          if((Get-FileHash -LiteralPath $file).Hash -cne $hash){throw 'Reference archive checksum mismatch'}
          if($IsWindows){Expand-Archive -LiteralPath $file -DestinationPath $tool}
          else{& tar -xf $file -C $tool;if($LASTEXITCODE -ne 0){throw 'Reference Node extraction failed'}}
          if(!(Test-Path -LiteralPath (Join-Path $tool $binary) -PathType Leaf)){throw 'Extracted reference Node binary absent'}
          $receipt='verification/env-node-fs-source-only'
          New-Item -ItemType Directory -Path $receipt|Out-Null
          [ordered]@{node=(Join-Path $tool $binary);archive=$archive;archive_sha256=$hash;node_sha256=(Get-FileHash -LiteralPath (Join-Path $tool $binary)).Hash}|ConvertTo-Json|Set-Content "$receipt/tool.json"
      - name: Capture three genuine platform Node24 packets without native qualification
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tools/Invoke-EnvArrayBufferViewSourceCapture.ps1 -ExpectedHead '${{ github.sha }}' -ExpectedManifestHash '490ADD7964BC2F7F1150E69EC2D14AA12180897797E5E975D06E1CA2A27AFE06' -SourceRoot verification/env-node-fs-reference -ToolReceipt verification/env-node-fs-source-only/tool.json -Receipt verification/env-node-fs-source-only
          if($LASTEXITCODE -ne 0){throw 'Original platform Source capture failed'}
          $proof=Get-Content verification/env-node-fs-source-only/source-only.json -Raw|ConvertFrom-Json
          if($proof.records.Count -ne 3 -or $proof.source_files -ne 1902 -or $proof.source_drift -ne 0 -or $proof.tool_drift -or $proof.native_qualified -or $proof.full_env_qualified -or $proof.public_activation){throw 'Source-only proof or scope mismatch'}
      - name: Retain genuine POSIX packets and explicit unqualified native boundary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-env-arraybufferview-source-only-${{ matrix.os }}-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          path: verification/env-node-fs-source-only/**
