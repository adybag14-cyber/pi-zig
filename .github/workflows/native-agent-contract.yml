name: Native Agent and CodeMode contract

on:
  push:
    branches: [checkpoint/native-composition241-20261010]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-agent-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        mode: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Freeze exact checkout and compiler inputs
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-agent-contract'
          New-Item -ItemType Directory -Path $taskReceipt -Force | Out-Null
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_HEAD) { throw 'Checkout head mismatch' }
          if ((& zig version).Trim() -cne '0.16.0') { throw 'Unexpected Zig version' }
          $taskZig = (Get-Command zig).Source
          $taskZigEnv = (& zig env) -join "`n"
          $taskLibMatch = [regex]::Match($taskZigEnv, '\.lib_dir = ("(?:[^"\\]|\\.)*")')
          if (!$taskLibMatch.Success) { throw 'Cannot identify the Zig 0.16 library directory' }
          $taskLib = $taskLibMatch.Groups[1].Value | ConvertFrom-Json
          $taskInputs = @(git ls-files | Sort-Object | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_).Hash } })
          $taskTools = @($taskZig; Get-ChildItem -LiteralPath $taskLib -File -Recurse | ForEach-Object FullName) | Sort-Object -Unique | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_).Hash } }
          $taskInputs | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/inputs.json"
          $taskTools | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/tools.json"
          [ordered]@{ head = $env:EXPECTED_HEAD; tree = (git rev-parse 'HEAD^{tree}').Trim(); mode = '${{ matrix.mode }}'; source_count = $taskInputs.Count; tool_count = @($taskTools).Count; public_activation = $false; scope = 'Private Agent/Loop allocation and CodeMode component qualification; full Pi and AgentSession parity remain separate requirements.' } | ConvertTo-Json | Set-Content "$taskReceipt/source.json"
      - name: Exercise every Agent allocation index and integrated CodeMode components
        shell: pwsh
        timeout-minutes: 28
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-agent-contract'
          & zig fmt --check build.zig src tools
          if ($LASTEXITCODE -ne 0) { throw 'Native formatting failed' }
          & zig build maintenance -j1 -- verify-vendors 2>&1 | Tee-Object -FilePath "$taskReceipt/vendors.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native C dependency provenance failed' }
          $taskGraphs = @('agent-complete-metadata','agent-complete-runtime','agent-loop-changes','agent-loop-tools','agent-loop-owned-stream')
          $taskTotals = @{}
          $taskProof = @()
          $env:PI_SDK_ALLOCATION_SHARDS = '8'
          $env:PI_SDK_ALLOCATION_TRACE = '1'
          foreach ($taskRange in 0..7) {
            $env:PI_SDK_ALLOCATION_SHARD = [string]$taskRange
            $taskLog = "$taskReceipt/agent-range-$taskRange.log"
            & zig build test-native-agent-complete test-native-agent-loop -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath $taskLog
            if ($LASTEXITCODE -ne 0) { throw "Agent range $taskRange failed" }
            $taskRaw = Get-Content -LiteralPath $taskLog -Raw
            if ($taskRaw -notmatch '28/28 tests passed') { throw 'Actual Agent test count changed; review coverage before accepting' }
            foreach ($taskGraph in $taskGraphs) {
              $taskLabel = [regex]::Escape($taskGraph)
              $taskMarkers = [regex]::Matches($taskRaw, "SDK_ALLOCATION_COMPLETE $taskLabel $taskRange/8 range=\[(\d+),(\d+)\) total=(\d+)")
              if ($taskMarkers.Count -ne 1) { throw "Missing or duplicated graph completion: $taskGraph" }
              $taskTotal = [int]$taskMarkers[0].Groups[3].Value
              if ($taskRange -eq 0) { $taskTotals[$taskGraph] = $taskTotal }
              elseif ($taskTotals[$taskGraph] -ne $taskTotal) { throw "Allocation universe changed: $taskGraph" }
              $taskStart = [int][Math]::Floor($taskTotal * $taskRange / 8)
              $taskEnd = [int][Math]::Floor($taskTotal * ($taskRange + 1) / 8)
              if ([int]$taskMarkers[0].Groups[1].Value -ne $taskStart -or [int]$taskMarkers[0].Groups[2].Value -ne $taskEnd) { throw 'Incorrect allocation partition' }
              $taskBegins = @([regex]::Matches($taskRaw, "SDK_ALLOCATION_INDEX_BEGIN $taskLabel (\d+)") | ForEach-Object { [int]$_.Groups[1].Value })
              $taskEnds = @([regex]::Matches($taskRaw, "SDK_ALLOCATION_INDEX_COMPLETE $taskLabel (\d+)") | ForEach-Object { [int]$_.Groups[1].Value })
              if ($taskBegins.Count -ne $taskEnd - $taskStart -or $taskEnds.Count -ne $taskEnd - $taskStart) { throw 'Missing allocation index' }
              for ($taskIndex = 0; $taskIndex -lt $taskBegins.Count; $taskIndex++) {
                if ($taskBegins[$taskIndex] -ne $taskStart + $taskIndex -or $taskEnds[$taskIndex] -ne $taskStart + $taskIndex) { throw 'Duplicate or out-of-order allocation index' }
              }
              $taskProof += [ordered]@{ graph = $taskGraph; range = $taskRange; start = $taskStart; end = $taskEnd; total = $taskTotal; complete = $true }
            }
          }
          $taskProof | ConvertTo-Json -Depth 5 | Set-Content "$taskReceipt/allocation-coverage.json"
          Remove-Item Env:PI_SDK_ALLOCATION_SHARD, Env:PI_SDK_ALLOCATION_SHARDS, Env:PI_SDK_ALLOCATION_TRACE
          & zig build test-native-codemode-sandbox test-native-codemode-run test-native-codemode-vm-worker test-native-codemode-controlled-binding test-native-durable-148622-wait-cycle test-native-durable-json-dto test-native-physical-stdio test-codemode-inline test-codemode-allocation test-durable-scheduler test-durable-json-clone -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/components.log"
          if ($LASTEXITCODE -ne 0) { throw 'Integrated component gate failed' }
          if ((Get-Content "$taskReceipt/components.log" -Raw) -notmatch '91/91 tests passed') { throw 'Integrated component coverage changed; review actual inventory' }
          [ordered]@{ status = 'passed'; ranges = 8; graphs = 5; distinct_agent_tests = 28; repeated_agent_executions = 224; component_tests = 91; completed_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content "$taskReceipt/result.json"
      - name: Verify every source and compiler posthash
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-agent-contract'
          foreach ($taskKind in @('inputs','tools')) {
            $taskManifest = "$taskReceipt/$taskKind.json"
            if (!(Test-Path -LiteralPath $taskManifest)) { throw "Missing $taskKind freeze" }
            $taskRows = @(Get-Content -LiteralPath $taskManifest -Raw | ConvertFrom-Json)
            $taskDrift = @($taskRows | Where-Object { !(Test-Path -LiteralPath $_.path) -or (Get-FileHash -LiteralPath $_.path).Hash -cne $_.sha256 })
            [ordered]@{ count = $taskRows.Count; drift = $taskDrift; checked_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json -Depth 5 | Set-Content "$taskReceipt/$taskKind-posthash.json"
            if ($taskDrift.Count -ne 0) { throw "$taskKind changed during qualification" }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-agent-contract-${{ matrix.os }}-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          path: verification/native-agent-contract/**
