name: Native Agent and CodeMode contract

on:
  push:
    branches: [checkpoint/native-composition241-20261010]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-agent-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, mode: Debug, group: 0, groups: 1}
          - {os: windows-latest, mode: ReleaseSafe, group: 0, groups: 1}
          - {os: ubuntu-latest, mode: Debug, group: 0, groups: 1}
          - {os: ubuntu-latest, mode: ReleaseSafe, group: 0, groups: 1}
          - {os: macos-latest, mode: Debug, group: 0, groups: 8}
          - {os: macos-latest, mode: Debug, group: 1, groups: 8}
          - {os: macos-latest, mode: Debug, group: 2, groups: 8}
          - {os: macos-latest, mode: Debug, group: 3, groups: 8}
          - {os: macos-latest, mode: Debug, group: 4, groups: 8}
          - {os: macos-latest, mode: Debug, group: 5, groups: 8}
          - {os: macos-latest, mode: Debug, group: 6, groups: 8}
          - {os: macos-latest, mode: Debug, group: 7, groups: 8}
          - {os: macos-latest, mode: ReleaseSafe, group: 0, groups: 8}
          - {os: macos-latest, mode: ReleaseSafe, group: 1, groups: 8}
          - {os: macos-latest, mode: ReleaseSafe, group: 2, groups: 8}
          - {os: macos-latest, mode: ReleaseSafe, group: 3, groups: 8}
          - {os: macos-latest, mode: ReleaseSafe, group: 4, groups: 8}
          - {os: macos-latest, mode: ReleaseSafe, group: 5, groups: 8}
          - {os: macos-latest, mode: ReleaseSafe, group: 6, groups: 8}
          - {os: macos-latest, mode: ReleaseSafe, group: 7, groups: 8}
    runs-on: ${{ matrix.os }}
    # Overall cold-build/job envelope; individual runtime guards stay unchanged.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Freeze exact checkout and compiler inputs
        id: freeze
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-agent-contract'
          New-Item -ItemType Directory -Path $taskReceipt -Force | Out-Null
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_HEAD) { throw 'Checkout head mismatch' }
          if ((& zig version).Trim() -cne '0.16.0') { throw 'Unexpected Zig version' }
          $taskZig = (Get-Command zig).Source
          $taskZigEnv = (& zig env) -join "`n"
          $taskLibMatch = [regex]::Match($taskZigEnv, '\.lib_dir = ("(?:[^"\\]|\\.)*")')
          if (!$taskLibMatch.Success) { throw 'Cannot identify the Zig 0.16 library directory' }
          $taskLib = $taskLibMatch.Groups[1].Value | ConvertFrom-Json
          $taskInputs = @(git ls-files | Sort-Object | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_).Hash } })
          $taskTools = @($taskZig; Get-ChildItem -LiteralPath $taskLib -File -Recurse | ForEach-Object FullName) | Sort-Object -Unique | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_).Hash } }
          $taskInputs | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/inputs.json"
          $taskTools | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/tools.json"
          [ordered]@{ head = $env:EXPECTED_HEAD; tree = (git rev-parse 'HEAD^{tree}').Trim(); mode = '${{ matrix.mode }}'; source_count = $taskInputs.Count; tool_count = @($taskTools).Count; public_activation = $false; scope = 'Private Agent/Loop allocation and CodeMode component qualification; full Pi and AgentSession parity remain separate requirements.' } | ConvertTo-Json | Set-Content "$taskReceipt/source.json"
      - name: Compile AgentLoop artifact before the runtime budget
        id: compile_agent_loop
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-native-agent-loop -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-loop.log
          if ($LASTEXITCODE -ne 0) { throw 'AgentLoop contract compilation failed' }
      - name: Compile complete Agent artifact before the runtime budget
        id: compile_agent
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-native-agent-complete -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-complete.log
          if ($LASTEXITCODE -ne 0) { throw 'Complete Agent contract compilation failed' }
      - name: Exercise every Agent allocation index
        shell: pwsh
        timeout-minutes: 28
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-agent-contract'
          & zig fmt --check build.zig src tools
          if ($LASTEXITCODE -ne 0) { throw 'Native formatting failed' }
          & zig build maintenance -j1 -- verify-vendors 2>&1 | Tee-Object -FilePath "$taskReceipt/vendors.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native C dependency provenance failed' }
          $taskGraphs = @('agent-complete-metadata','agent-complete-runtime','agent-loop-changes','agent-loop-tools','agent-loop-owned-stream')
          # macOS Debug allocator instrumentation made the larger late ranges
          # exceed the unchanged 120s per-test guard. Smaller partitions retain
          # every original failure index and the same full Source assertions.
          $taskShards = if ($IsMacOS) { 64 } else { 8 }
          $taskGroups = ${{ matrix.groups }}
          $taskGroup = ${{ matrix.group }}
          $taskRangeStart = [int][Math]::Floor($taskShards * $taskGroup / $taskGroups)
          $taskRangeEnd = [int][Math]::Floor($taskShards * ($taskGroup + 1) / $taskGroups)

          $env:PI_SDK_ALLOCATION_SHARDS = [string]$taskShards
          $env:PI_SDK_ALLOCATION_TRACE = '1'
          foreach ($taskRange in $taskRangeStart..($taskRangeEnd - 1)) {
            $env:PI_SDK_ALLOCATION_SHARD = [string]$taskRange
            $taskLog = "$taskReceipt/agent-range-$taskRange.log"
            & zig build test-native-agent-complete test-native-agent-loop -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath $taskLog
            if ($LASTEXITCODE -ne 0) { throw "Agent range $taskRange failed" }
          }
          & zig build test-agent-allocation-coverage -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/coverage-checker.log"
          if ($LASTEXITCODE -ne 0) { throw 'Agent allocation coverage checker regressions failed' }
          & zig build maintenance -j1 -- verify-agent-allocation-group $taskReceipt $taskShards $taskGroup $taskGroups 2>&1 | Tee-Object -FilePath "$taskReceipt/coverage-validation.log"
          if ($LASTEXITCODE -ne 0) { throw 'Actual Agent runtime allocation coverage failed' }
          Remove-Item Env:PI_SDK_ALLOCATION_SHARD, Env:PI_SDK_ALLOCATION_SHARDS, Env:PI_SDK_ALLOCATION_TRACE
          [ordered]@{ status = 'passed'; global_ranges = $taskShards; range_start = $taskRangeStart; range_end = $taskRangeEnd; group = $taskGroup; groups = $taskGroups; graphs = 5; distinct_agent_tests = 28; repeated_agent_executions = 28 * ($taskRangeEnd - $taskRangeStart); completed_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content "$taskReceipt/agent-result.json"
      - name: Compile complete exhaustive probes before the runtime budget
        id: compile_exhaustive
        if: ${{ !cancelled() && steps.compile_agent.outcome == 'success' && runner.os == 'macOS' }}
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-hosted-exhaustive-allocation -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-exhaustive.log
          if ($LASTEXITCODE -ne 0) { throw 'Complete exhaustive probe compilation failed' }
      - name: Exercise every original CodeMode worker and TUI allocation index
        if: ${{ !cancelled() && steps.compile_exhaustive.outcome == 'success' && runner.os == 'macOS' }}
        shell: pwsh
        timeout-minutes: 28
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-agent-contract'
          $taskGroup = ${{ matrix.group }}
          $taskGroups = ${{ matrix.groups }}
          $taskStart = [int][Math]::Floor(64 * $taskGroup / $taskGroups)
          $taskEnd = [int][Math]::Floor(64 * ($taskGroup + 1) / $taskGroups)
          # Canonical g0/range0 is executed by the ordinary Core/latest gates.
          # It is never repeated here or counted twice in canonical coverage.
          $env:PI_EXHAUSTIVE_ALLOCATION_SHARDS = '64'
          for ($taskRange = [Math]::Max(1,$taskStart); $taskRange -lt $taskEnd; $taskRange++) {
            $env:PI_EXHAUSTIVE_ALLOCATION_SHARD = [string]$taskRange
            $taskLog = "$taskReceipt/exhaustive-range-$taskRange.log"
            & zig build test-hosted-exhaustive-allocation -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath $taskLog
            if ($LASTEXITCODE -ne 0) { throw "Original exhaustive allocation range $taskRange failed" }
            if ((Get-Content -LiteralPath $taskLog -Raw) -notmatch '18/18 tests passed') { throw 'Original exhaustive probe inventory changed' }
          }
          Remove-Item Env:PI_EXHAUSTIVE_ALLOCATION_SHARD, Env:PI_EXHAUSTIVE_ALLOCATION_SHARDS
      - name: Compile integrated CodeMode artifacts before the runtime budget
        id: compile_core
        if: ${{ !cancelled() && steps.compile_agent.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-hosted-core-components -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-components.log
          if ($LASTEXITCODE -ne 0) { throw 'Integrated CodeMode component compilation failed' }
      - name: Exercise integrated CodeMode components
        if: ${{ !cancelled() && steps.compile_core.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-agent-contract'
          if ($IsMacOS) { $env:PI_EXHAUSTIVE_ALLOCATION_SHARD = '0'; $env:PI_EXHAUSTIVE_ALLOCATION_SHARDS = '64' }
          & zig build test-native-codemode-sandbox test-native-codemode-run test-native-codemode-vm-worker test-native-codemode-controlled-binding test-native-durable-148622-wait-cycle test-native-durable-json-dto test-native-physical-stdio test-codemode-inline test-codemode-allocation test-durable-scheduler test-durable-json-clone -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/components.log"
          if ($LASTEXITCODE -ne 0) { throw 'Integrated component gate failed' }
          if ((Get-Content "$taskReceipt/components.log" -Raw) -notmatch '93/93 tests passed') { throw 'Integrated component coverage changed; review actual inventory' }
          [ordered]@{ status = 'passed'; component_tests = 93; completed_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content "$taskReceipt/result.json"
      - name: Compile latest MCP application and restoration artifacts before the runtime budget
        id: compile_latest
        if: ${{ !cancelled() && steps.compile_agent.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-hosted-latest-components -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-latest.log
          if ($LASTEXITCODE -ne 0) { throw 'latest MCP application and restoration component compilation failed' }
      - name: Compile default CodeMode model artifacts before the runtime budget
        id: compile_models
        if: ${{ !cancelled() && steps.compile_agent.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-hosted-model-components -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-model.log
          if ($LASTEXITCODE -ne 0) { throw 'default CodeMode model component compilation failed' }
      - name: Compile pinned catalogue and maintenance artifacts before the runtime budget
        id: compile_catalog
        if: ${{ !cancelled() && steps.compile_agent.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-hosted-catalog-components -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-catalog.log
          if ($LASTEXITCODE -ne 0) { throw 'pinned catalogue and maintenance component compilation failed' }
      - name: Compile Chord context artifacts before the runtime budget
        id: compile_chord
        if: ${{ !cancelled() && steps.compile_agent.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-hosted-chord-components -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-chord.log
          if ($LASTEXITCODE -ne 0) { throw 'Chord context component compilation failed' }
      - name: Compile SDK message artifacts before the runtime budget
        id: compile_sdk
        if: ${{ !cancelled() && steps.compile_agent.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-hosted-sdk-components -Doptimize=${{ matrix.mode }} -j1 --summary all 2>&1 | Tee-Object verification/native-agent-contract/compile-sdk.log
          if ($LASTEXITCODE -ne 0) { throw 'SDK message component compilation failed' }
      - name: Exercise latest MCP application restoration and durable replay components
        if: ${{ !cancelled() && steps.compile_latest.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-agent-contract'
          if ($IsMacOS) { $env:PI_EXHAUSTIVE_ALLOCATION_SHARD = '0'; $env:PI_EXHAUSTIVE_ALLOCATION_SHARDS = '64' }
          & zig build test-native-durable-codemode-outcome test-native-durable-codemode-journal-core test-custom-editor-frontend test-extension-filesystem test-print-mode-process test-mcp-runtime test-mcp-configured test-native-tui-alt-source test-native-tui-base-source -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/latest-components.log"
          if ($LASTEXITCODE -ne 0) { throw 'Latest MCP application and replay components failed' }
          if ((Get-Content "$taskReceipt/latest-components.log" -Raw) -notmatch '207/207 tests passed') { throw 'Latest component inventory changed; review exact execution and any platform skips' }
          [ordered]@{ status = 'passed'; tests = 207; completed_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content "$taskReceipt/latest-result.json"
      - name: Exercise current model catalogue Chord and SDK slices
        if: ${{ !cancelled() && steps.compile_models.outcome == 'success' && steps.compile_catalog.outcome == 'success' && steps.compile_chord.outcome == 'success' && steps.compile_sdk.outcome == 'success' && matrix.group == 0 }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-agent-contract'
          # Each expected inventory was observed independently on the current
          # native source. These are separate gates, not a synthetic combined pass.
          $taskSlices = @(
            @{target='test-native-durable-codemode-model-catalog'; tests=8},
            @{target='test-latest-catalog'; tests=60},
            @{target='test-maintenance'; tests=7},
            @{target='test-exhaustive-allocation-coverage'; tests=4},
            @{target='test-exhaustive-allocation-helper'; tests=3},
            @{target='test-native-chord-context-source'; tests=11},
            @{target='test-native-chord-resource-source'; tests=4},
            @{target='test-native-models-typed-services'; tests=12},
            @{target='test-native-models-stream-regressions'; tests=7},
            @{target='test-native-chord-contract-source'; tests=4},
            @{target='test-native-chord-clone-source'; tests=4},
            @{target='test-native-chord-normalization-evaluate-source'; tests=9},
            @{target='test-native-sdk-session-queries'; tests=11},
            @{target='test-native-sdk-query-consumers'; tests=11},
            @{target='test-native-sdk-send-user'; tests=11},
            @{target='test-native-sdk-session-lifecycle'; tests=11}
          )
          $taskProof = @()
          foreach ($taskSlice in $taskSlices) {
            $taskLog = "$taskReceipt/$($taskSlice.target).log"
            & zig build $taskSlice.target -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath $taskLog
            if ($LASTEXITCODE -ne 0) { throw "Current slice failed: $($taskSlice.target)" }
            $taskCount = $taskSlice.tests
            if ((Get-Content -LiteralPath $taskLog -Raw) -notmatch "(?m)Build Summary:.*\b$taskCount/$taskCount tests passed") { throw "Actual inventory changed: $($taskSlice.target)" }
            $taskProof += [ordered]@{target=$taskSlice.target; tests=$taskCount; status='passed'}
          }
          [ordered]@{status='passed'; slices=$taskProof; completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json -Depth 5 | Set-Content "$taskReceipt/additional-result.json"
      - name: Verify complete canonical original allocation coverage
        if: ${{ !cancelled() && steps.compile_agent.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-agent-contract'
          $taskGroup = ${{ matrix.group }}
          $taskGroups = ${{ matrix.groups }}
          $taskRanges = if ($IsMacOS) {64} else {1}
          if ($taskGroup -eq 0) {
            $taskCore = Get-Content "$taskReceipt/components.log" -Raw
            $taskLatest = Get-Content "$taskReceipt/latest-components.log" -Raw
            [IO.File]::WriteAllText((Join-Path (Get-Location) "$taskReceipt/exhaustive-range-0.log"),$taskCore+"`n"+$taskLatest,[Text.UTF8Encoding]::new($false))
          }
          & zig build test-agent-allocation-coverage test-exhaustive-allocation-coverage test-exhaustive-allocation-helper -Doptimize=${{ matrix.mode }} -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/exhaustive-checkers.log"
          if ($LASTEXITCODE -ne 0) { throw 'Complete allocation checker regressions failed' }
          & zig build maintenance -j1 -- verify-exhaustive-allocation-group $taskReceipt $taskRanges $taskGroup $taskGroups 2>&1 | Tee-Object -FilePath "$taskReceipt/exhaustive-validation.log"
          if ($LASTEXITCODE -ne 0) { throw 'Original allocation coverage omitted duplicated or changed a failure index' }
          [ordered]@{status='passed'; graphs=6; global_ranges=$taskRanges; group=$taskGroup; groups=$taskGroups; canonical_range0='Core/latest actual logs only'; duplicated_failure_indices=0; unlimited_baselines='One original full probe per graph per canonical range; not counted as failure-index coverage'; completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json -Depth 5 | Set-Content "$taskReceipt/exhaustive-result.json"
      - name: Verify every source and compiler posthash
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-agent-contract'
          foreach ($taskKind in @('inputs','tools')) {
            $taskManifest = "$taskReceipt/$taskKind.json"
            if (!(Test-Path -LiteralPath $taskManifest)) { throw "Missing $taskKind freeze" }
            $taskRows = @(Get-Content -LiteralPath $taskManifest -Raw | ConvertFrom-Json)
            $taskDrift = @($taskRows | Where-Object { !(Test-Path -LiteralPath $_.path) -or (Get-FileHash -LiteralPath $_.path).Hash -cne $_.sha256 })
            [ordered]@{ count = $taskRows.Count; drift = $taskDrift; checked_utc = [DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json -Depth 5 | Set-Content "$taskReceipt/$taskKind-posthash.json"
            if ($taskDrift.Count -ne 0) { throw "$taskKind changed during qualification" }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-agent-contract-${{ matrix.os }}-${{ matrix.mode }}-g${{ matrix.group }}-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          path: verification/native-agent-contract/**

  coverage:
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-agent-contract-*-${{ github.sha }}
          path: contract-results
      - name: Require every platform group and allocation index partition
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskGraphs = @('agent-complete-metadata','agent-complete-runtime','agent-loop-changes','agent-loop-tools','agent-loop-owned-stream')
          $taskSummary = @()
          foreach ($taskOs in @('windows-latest','ubuntu-latest','macos-latest')) {
            foreach ($taskMode in @('Debug','ReleaseSafe')) {
              $taskGroups = if ($taskOs -eq 'macos-latest') { 8 } else { 1 }
              $taskRanges = if ($taskOs -eq 'macos-latest') { 64 } else { 8 }
              $taskAll = @()
              $taskExhaustiveAll = @()
              $taskExhaustiveRanges = if ($taskOs -eq 'macos-latest') {64} else {1}
              foreach ($taskGroup in 0..($taskGroups - 1)) {
                $taskRoot = "contract-results/native-agent-contract-$taskOs-$taskMode-g$taskGroup-$env:EXPECTED_HEAD"
                $taskSource = Get-Content "$taskRoot/source.json" -Raw | ConvertFrom-Json
                $taskResult = Get-Content "$taskRoot/agent-result.json" -Raw | ConvertFrom-Json
                if ($taskSource.head -cne $env:EXPECTED_HEAD -or $taskSource.mode -cne $taskMode -or $taskResult.status -cne 'passed' -or $taskResult.group -ne $taskGroup -or $taskResult.groups -ne $taskGroups -or $taskResult.global_ranges -ne $taskRanges) { throw 'Missing or inconsistent exact-head group qualification' }
                foreach ($taskKind in @('inputs','tools')) {
                  $taskPost = Get-Content "$taskRoot/$taskKind-posthash.json" -Raw | ConvertFrom-Json
                  if (!$taskPost.count -or @($taskPost.drift).Count) { throw 'Group input posthash missing or changed' }
                }
                $taskAll += @(Get-Content "$taskRoot/allocation-coverage.json" -Raw | ConvertFrom-Json)
                $taskExhaustiveResult = Get-Content "$taskRoot/exhaustive-result.json" -Raw | ConvertFrom-Json
                if ($taskExhaustiveResult.status -cne 'passed' -or $taskExhaustiveResult.graphs -ne 6 -or $taskExhaustiveResult.global_ranges -ne $taskExhaustiveRanges -or $taskExhaustiveResult.group -ne $taskGroup -or $taskExhaustiveResult.groups -ne $taskGroups -or $taskExhaustiveResult.duplicated_failure_indices -ne 0) { throw 'Original exhaustive allocation group qualification missing' }
                $taskExhaustiveAll += @(Get-Content "$taskRoot/exhaustive-coverage.json" -Raw | ConvertFrom-Json)
                if ($taskGroup -eq 0) {
                  $taskComponents = Get-Content "$taskRoot/result.json" -Raw | ConvertFrom-Json
                  $taskLatest = Get-Content "$taskRoot/latest-result.json" -Raw | ConvertFrom-Json
                  if ($taskComponents.status -cne 'passed' -or $taskComponents.component_tests -ne 93 -or $taskLatest.status -cne 'passed' -or $taskLatest.tests -ne 207) { throw 'Platform component qualification is incomplete' }
                  $taskAdditional = Get-Content "$taskRoot/additional-result.json" -Raw | ConvertFrom-Json
                  $taskExpectedSlices = @{'test-native-durable-codemode-model-catalog'=8; 'test-latest-catalog'=60; 'test-maintenance'=7; 'test-exhaustive-allocation-coverage'=4; 'test-exhaustive-allocation-helper'=3; 'test-native-chord-context-source'=11; 'test-native-chord-resource-source'=4; 'test-native-models-typed-services'=12; 'test-native-models-stream-regressions'=7; 'test-native-chord-contract-source'=4; 'test-native-chord-clone-source'=4; 'test-native-chord-normalization-evaluate-source'=9; 'test-native-sdk-session-queries'=11; 'test-native-sdk-query-consumers'=11; 'test-native-sdk-send-user'=11; 'test-native-sdk-session-lifecycle'=11}
                  if ($taskAdditional.status -cne 'passed' -or $taskAdditional.slices.Count -ne $taskExpectedSlices.Count) { throw 'Current component slice qualification missing' }
                  foreach ($taskTarget in $taskExpectedSlices.Keys) {
                    $taskSlice = @($taskAdditional.slices | Where-Object target -CEQ $taskTarget)
                    if ($taskSlice.Count -ne 1 -or $taskSlice[0].status -cne 'passed' -or $taskSlice[0].tests -ne $taskExpectedSlices[$taskTarget]) { throw "Current component slice inventory incomplete: $taskTarget" }
                  }
                }
              }
              if ($taskAll.Count -ne 5 * $taskRanges) { throw 'Unknown or missing allocation graph partition' }
              foreach ($taskGraph in $taskGraphs) {
                $taskRows = @($taskAll | Where-Object graph -CEQ $taskGraph | Sort-Object range)
                if ($taskRows.Count -ne $taskRanges) { throw 'Missing graph ranges' }
                $taskTotal = [int]$taskRows[0].total
                $taskPrevious = 0
                for ($taskRange = 0; $taskRange -lt $taskRanges; $taskRange++) {
                  $taskRow = $taskRows[$taskRange]
                  $taskStart = [int][Math]::Floor($taskTotal * $taskRange / $taskRanges)
                  $taskEnd = [int][Math]::Floor($taskTotal * ($taskRange + 1) / $taskRanges)
                  if (!$taskRow.complete -or $taskRow.range -ne $taskRange -or $taskRow.total -ne $taskTotal -or $taskRow.start -ne $taskStart -or $taskRow.end -ne $taskEnd -or $taskStart -ne $taskPrevious) { throw 'Allocation index gap duplicate or changed universe' }
                  $taskPrevious = $taskEnd
                }
                if ($taskPrevious -ne $taskTotal) { throw 'Incomplete graph universe' }
                $taskSummary += [ordered]@{ os = $taskOs; mode = $taskMode; graph = $taskGraph; total = $taskTotal; ranges = $taskRanges; complete = $true }
              }
              if ($taskExhaustiveAll.Count -ne 6 * $taskExhaustiveRanges) { throw 'Missing or duplicated original allocation partition' }
              foreach ($taskGraph in @('codemode-host','codemode-workers','codemode-discovery','codemode-adapter','codemode-vm-owner','tui-alt')) {
                $taskRows = @($taskExhaustiveAll | Where-Object graph -CEQ $taskGraph | Sort-Object range)
                if ($taskRows.Count -ne $taskExhaustiveRanges) { throw "Original allocation graph coverage missing: $taskGraph" }
                $taskTotal = [long]$taskRows[0].total
                $taskPrevious = 0
                if ($taskTotal -lt 1) { throw 'Original allocation baseline is empty' }
                for ($taskRange = 0; $taskRange -lt $taskExhaustiveRanges; $taskRange++) {
                  $taskRow = $taskRows[$taskRange]
                  $taskStart = [long][Math]::Floor($taskTotal * $taskRange / $taskExhaustiveRanges)
                  $taskEnd = [long][Math]::Floor($taskTotal * ($taskRange + 1) / $taskExhaustiveRanges)
                  if (!$taskRow.complete -or $taskRow.range -ne $taskRange -or $taskRow.total -ne $taskTotal -or $taskRow.start -ne $taskStart -or $taskRow.end -ne $taskEnd -or $taskStart -ne $taskPrevious) { throw 'Original allocation index gap duplicate reordered or changed baseline universe' }
                  $taskPrevious = $taskEnd
                }
                if ($taskPrevious -ne $taskTotal) { throw 'Original allocation failure universe incomplete' }
                $taskSummary += [ordered]@{os=$taskOs; mode=$taskMode; scope='original-exhaustive-allocation'; graph=$taskGraph; total=$taskTotal; ranges=$taskExhaustiveRanges; complete=$true; duplicated_failure_indices=0}
              }
            }
          }
          if ($env:PLATFORM_RESULT -cne 'success') { throw 'A required platform job failed' }
          $taskSummary | ConvertTo-Json -Depth 5 | Set-Content contract-results/complete-coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-agent-contract-complete-${{ github.sha }}
          retention-days: 14
          path: contract-results/complete-coverage.json
