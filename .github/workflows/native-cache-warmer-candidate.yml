name: Native cache warmer latest Source qualification

on:
  workflow_call:
  push:
    branches: [work/native-session-factory-composition-20261013]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-cache-warmer-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, ReleaseSafe]
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Freeze exact source and compiler
        id: freeze
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-cache-warmer-candidate'
          New-Item -ItemType Directory -Path $taskReceipt -Force | Out-Null
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_HEAD) { throw 'Checkout head mismatch' }
          if ((& zig version).Trim() -cne '0.16.0') { throw 'Unexpected Zig version' }
          $taskZigInfo = [IO.FileInfo]::new((Get-Command zig | Select-Object -First 1).Source)
          $taskZigTarget = $taskZigInfo.ResolveLinkTarget($true)
          $taskZig = if ($taskZigTarget) { $taskZigTarget.FullName } else { $taskZigInfo.FullName }
          $taskToolRoot = Split-Path -Parent $taskZig
          $taskZigEnv = (& zig env) -join "`n"
          $taskLibMatch = [regex]::Match($taskZigEnv, '\.lib_dir = ("(?:[^"\\]|\\.)*")')
          if (!$taskLibMatch.Success) { throw 'Cannot identify the Zig library directory' }
          $taskLib = $taskLibMatch.Groups[1].Value | ConvertFrom-Json
          $taskInputs = @(git ls-files | Sort-Object | ForEach-Object { [ordered]@{path=$_; sha256=(Get-FileHash -LiteralPath $_).Hash} })
          $taskTools = @(Get-ChildItem -LiteralPath $taskToolRoot -File -Recurse | Sort-Object FullName | ForEach-Object { [ordered]@{path=$_.FullName; sha256=(Get-FileHash -LiteralPath $_.FullName).Hash} })
          $taskInputs | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/inputs.json"
          $taskTools | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/tools.json"
          [ordered]@{head=$env:EXPECTED_HEAD; tree=(git rev-parse 'HEAD^{tree}').Trim(); mode='${{ matrix.mode }}'; source_count=$taskInputs.Count; tool_count=@($taskTools).Count; public_activation=$false; scope='Complete cache warming class, pricing and environment helpers; full session factory and full Pi parity remain separate'} | ConvertTo-Json | Set-Content "$taskReceipt/source.json"
      - name: Compile exact cache warming artifacts before the runtime budget
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          & zig build build-native-sdk-cache-warmer -Doptimize=${{ matrix.mode }} -Duse-llvm=true -j1 --summary all 2>&1 | Tee-Object verification/native-cache-warmer-candidate/compile.log
          if ($LASTEXITCODE -ne 0) { throw 'Cache warming cold compilation failed' }
      - name: Exercise original cache warming class and native ownership
        id: runtime
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $taskReceipt = 'verification/native-cache-warmer-candidate'
          & zig build test-native-sdk-cache-warmer -Doptimize=${{ matrix.mode }} -Duse-llvm=true -j1 --test-timeout 120s --summary all 2>&1 | Tee-Object -FilePath "$taskReceipt/runtime.log"
          if ($LASTEXITCODE -ne 0) { throw 'Cache warming candidate runtime failed' }
          $taskLog = Get-Content "$taskReceipt/runtime.log" -Raw
          $taskInventoryMatch = [regex]::Match($taskLog, '(?m)CACHE_WARMER_TEST_INVENTORY=(\[[^\r\n]+\])')
          if (!$taskInventoryMatch.Success) { throw 'Selected native test inventory missing' }
          $taskNames = @($taskInventoryMatch.Groups[1].Value | ConvertFrom-Json)
          foreach ($taskRequired in @('selected inventory','matches70 genuine latest Source','real timer refresh and cancellation','formatters match34 genuine latest Source','allocation failures retain fatal provenance')) {
            if (@($taskNames | Where-Object { $_.Contains($taskRequired) }).Count -ne 1) { throw "Required Source comparator not selected: $taskRequired" }
          }
          $taskCount = $taskNames.Count
          if ($taskLog -notmatch "(?m)Build Summary:.*\b$taskCount/$taskCount tests passed") { throw 'Selected runtime inventory did not all pass' }
          [ordered]@{head='${{ github.sha }}'; status='passed'; mode='${{ matrix.mode }}'; selected_tests=$taskCount; source_lifecycle_cases=70; source_format_cases=34; public_activation=$false; completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content "$taskReceipt/result.json"
      - name: Verify frozen inputs after terminal execution
        if: ${{ always() && steps.freeze.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskReceipt = 'verification/native-cache-warmer-candidate'
          foreach ($taskKind in @('inputs','tools')) {
            $taskRows = @(Get-Content "$taskReceipt/$taskKind.json" -Raw | ConvertFrom-Json)
            $taskDrift = @($taskRows | Where-Object { !(Test-Path -LiteralPath $_.path) -or (Get-FileHash -LiteralPath $_.path).Hash -cne $_.sha256 } | ForEach-Object path)
            [ordered]@{count=$taskRows.Count; drift=$taskDrift; completed_utc=[DateTimeOffset]::UtcNow.ToString('o')} | ConvertTo-Json -Depth 4 | Set-Content "$taskReceipt/$taskKind-posthash.json"
            if ($taskDrift.Count) { throw "Candidate frozen $taskKind changed" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-cache-warmer-candidate-${{ matrix.os }}-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 14
          path: verification/native-cache-warmer-candidate/
