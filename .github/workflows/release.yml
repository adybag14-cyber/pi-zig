name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.2.0). Leave empty to build artifacts only."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-linux-gnu
            artifact: pi-x86_64-linux
            ext: ""
          - target: aarch64-linux-gnu
            artifact: pi-aarch64-linux
            ext: ""
          # Windows
          - target: x86_64-windows-gnu
            artifact: pi-x86_64-windows
            ext: ".exe"
          - target: aarch64-windows-gnu
            artifact: pi-aarch64-windows
            ext: ".exe"
          # macOS
          - target: x86_64-macos
            artifact: pi-x86_64-macos
            ext: ""
          - target: aarch64-macos
            artifact: pi-aarch64-macos
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build release binary
        run: |
          set -euo pipefail
          zig version
          zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
          mkdir -p dist
          src="zig-out/bin/pi${{ matrix.ext }}"
          if [[ ! -f "$src" ]]; then
            # Some targets may omit .exe in zig-out naming; try fallback
            if [[ -f zig-out/bin/pi ]]; then
              src="zig-out/bin/pi"
            else
              echo "Binary not found under zig-out/bin" >&2
              ls -la zig-out/bin || true
              exit 1
            fi
          fi
          dest="dist/${{ matrix.artifact }}${{ matrix.ext }}"
          cp "$src" "$dest"
          chmod +x "$dest" || true
          # checksum
          (cd dist && sha256sum "$(basename "$dest")" > "$(basename "$dest").sha256")
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes always publish. Manual dispatch publishes when a tag is provided.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like v0.2.0 (got: $TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Flatten downloaded artifacts
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            cp "$f" "release/$base"
          done
          cd release
          # Aggregate checksums
          sha256sum pi-* > SHA256SUMS
          ls -la
          cat SHA256SUMS

      - name: Create or update git tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: pi ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          files: |
            release/pi-*
            release/SHA256SUMS
          body: |
            ## pi (pi-zig) ${{ steps.meta.outputs.tag }}

            Multi-architecture release binaries for the Zig 0.16.0 coding-agent harness.

            ### Assets

            | Asset | Platform |
            |-------|----------|
            | `pi-x86_64-linux` | Linux x86_64 |
            | `pi-aarch64-linux` | Linux aarch64 |
            | `pi-x86_64-windows.exe` | Windows x86_64 |
            | `pi-aarch64-windows.exe` | Windows aarch64 |
            | `pi-x86_64-macos` | macOS Intel |
            | `pi-aarch64-macos` | macOS Apple Silicon |

            ### Verify

            ```bash
            sha256sum -c SHA256SUMS
            chmod +x pi-*-linux pi-*-macos
            ./pi-x86_64-linux --version
            ```

            Built with Zig **${{ env.ZIG_VERSION }}**, optimize=`ReleaseSafe`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
