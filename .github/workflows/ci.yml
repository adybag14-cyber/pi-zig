name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig version
        run: zig version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify generated model catalog
        run: node scripts/generate_builtin_catalog.mjs --check

      - name: Check Zig formatting
        run: zig fmt --check build.zig src

      - name: Audit native source
        run: python scripts/audit_real_source.py

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Setup SQLite development library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install "sqlite3[fts5]:x64-windows"
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          "PI_SQLITE_LIB_DIR=$(Join-Path $installed 'lib')" >> $env:GITHUB_ENV
          (Join-Path $installed "bin") >> $env:GITHUB_PATH

      - name: Test
        shell: bash
        timeout-minutes: 20
        run: |
          if [[ -n "${PI_SQLITE_LIB_DIR:-}" ]]; then
            zig build test -j2 --summary all -Dsqlite-lib-dir="$PI_SQLITE_LIB_DIR"
          else
            zig build test -j2 --summary all
          fi

      - name: Smoke --version
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./zig-out/bin/pi.exe --version
          else
            ./zig-out/bin/pi --version
          fi
