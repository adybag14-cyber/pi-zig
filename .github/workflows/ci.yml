name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # A restored Zig cache produced an InvalidExe test artifact after
          # GitHub moved macos-latest to ARM64. Rebuild every matrix entry from
          # the checked-out source so CI proves the current target binaries.
          use-cache: false

      - name: Zig version
        run: zig version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup native image converter (Linux fixtures)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes imagemagick

      - name: Verify generated model catalog
        run: zig build maintenance -- catalog --check

      - name: Verify native C dependency provenance
        run: zig build maintenance -- verify-vendors

      - name: Verify source artifact inventory
        run: zig build maintenance -- verify-artifacts

      - name: Check Zig formatting
        run: zig fmt --check build.zig src tools

      - name: Reject synthetic source surfaces
        run: zig build maintenance -- audit-structure

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Test
        shell: bash
        # This gate cold-compiles the complete test graph. Bound individual
        # test execution as well as the whole build, as local qualification does.
        timeout-minutes: 45
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export PI_CODEMODE_ALLOCATION_SHARD=0
            export PI_CODEMODE_ALLOCATION_SHARDS=8
          fi
          # SDK ownership sweeps passed in three to four minutes in the frozen
          # full qualification; keep every injected allocation case enabled.
          zig build test test-provider-contracts -j2 --test-timeout 600s --summary all

      - name: Qualify macOS native environment lifecycle (ReleaseSafe)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        run: zig build test-env test-env-capability test-durable-backend -Doptimize=ReleaseSafe -j2 --summary all

      - name: Smoke --version
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./zig-out/bin/pi.exe --version
          else
            ./zig-out/bin/pi --version
          fi

  codemode-allocation:
    name: macOS codemode allocation (${{ matrix.shard }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Exhaustive codemode allocation shard
        # This target runs the two exhaustive ownership tests. The complete
        # codemode, CLI and model suites still run in the OS matrix above.
        # Allow cold compilation separately from the per-test hang deadline.
        timeout-minutes: 20
        env:
          PI_CODEMODE_ALLOCATION_SHARD: ${{ matrix.shard }}
          PI_CODEMODE_ALLOCATION_SHARDS: "8"
        run: zig build test-codemode-allocation -j2 --test-timeout 180s --summary all
