name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig version
        run: zig version

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Test
        run: zig build test --summary all

      - name: Smoke --version
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./zig-out/bin/pi.exe --version
          else
            ./zig-out/bin/pi --version
          fi
