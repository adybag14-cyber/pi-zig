name: Native process test diagnosis

on:
  push:
    branches: [diagnose/pi-native-macos-20261005]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-target:
    name: ${{ matrix.os }} runtime ${{ matrix.filter }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        filter: [standalone pipes, UI real selector, UI explicit cancellation, UI prompt hooks]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD
          uname -a
          zig version
          node --version
      - name: Run named native target with verbose artifact commands
        timeout-minutes: 6
        run: zig build test-native-runtime '-Dnative-runtime-filter=${{ matrix.filter }}' -j1 --verbose --summary all
