name: Private native Env guest Source qualification

on:
  push:
    branches: [work/env-guest-e6220e1-20261013]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-native-env-guest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref_name == 'work/env-guest-e6220e1-20261013'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [Debug, ReleaseSafe]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Compile frozen private guest candidate without executing tests
        timeout-minutes: 23
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tools/Invoke-EnvGuestQualification.ps1 -Phase Compile -Mode '${{ matrix.mode }}' -ExpectedHead '${{ github.sha }}' -ExpectedSourceManifestHash 'A856D7422FC9F730AF84740E529647F93F728A096EF984E5C3E10AE685F1B3A6' -ExpectedGuestManifestHash '26B2970C99C6B2631C301F41ABFB897EFDD64A5DA9439936F488EB40F6F43E67' -OuterSeconds 1320 -Receipt 'verification/env-guest/compile'
          if($LASTEXITCODE -ne 0){throw 'Private Env guest compile-only phase failed'}
      - name: Run private guest Source comparators and mandatory original Env gates
        timeout-minutes: 7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tools/Invoke-EnvGuestQualification.ps1 -Phase Run -Mode '${{ matrix.mode }}' -ExpectedHead '${{ github.sha }}' -ExpectedSourceManifestHash 'A856D7422FC9F730AF84740E529647F93F728A096EF984E5C3E10AE685F1B3A6' -ExpectedGuestManifestHash '26B2970C99C6B2631C301F41ABFB897EFDD64A5DA9439936F488EB40F6F43E67' -OuterSeconds 300 -Receipt 'verification/env-guest/run'
          if($LASTEXITCODE -ne 0){throw 'Private Env guest qualification failed'}
      - name: Retain frozen Source tools process actual inventory and terminal result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-native-env-guest-windows-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          path: verification/env-guest/**
