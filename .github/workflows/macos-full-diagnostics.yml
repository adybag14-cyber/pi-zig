name: macOS full graph diagnostics

on:
  pull_request:

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Full graph with individual test progress
        timeout-minutes: 20
        run: zig build test test-provider-contracts -Ddiagnostic-all-tests=true -j2 --summary all
