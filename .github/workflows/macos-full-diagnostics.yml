name: macOS full graph diagnostics

on:
  pull_request:

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trace codemode allocation failures
        timeout-minutes: 10
        env:
          PI_CODEMODE_ALLOCATION_TRACE: "1"
        run: zig build test-codemode -Ddiagnostic-all-tests=true -j2 --summary all
